\n</blockquote>\n","text":"题号 我错在哪 对应知识点 正确结论（自己写一遍） 例：B1-7 记成 1 PFLOPS = 100 PLOPS 算力换算 1 PFLOPS = 1000 TFLOPS 完成标准：A/B/C 三组正确率 ≥ 80%，D 组全对 → 9/13–14 任务达成！ 明天预告：算法 + 安全模块学习包（含 KNN/K-Means 辨析、神经网络三兄弟、伦理场景题）。","chars":180}]},"nc1d2":{"id":"nc1d2","title":"计算机一级 · 9.15–16","sub":"算法 · 安全","sections":[{"id":"s0","title":"开篇","tab":"开篇","html":"<blockquote>\n<p>配套科目：一级人工智能与大模型基础（科目代码 18）<br>用法：<strong>第一部分先背 → 第二部分闭卷做题 → 第三部分翻到最后对答案 → 错题抄进「错题复记表」</strong><br>安排：9/15 背 4.1–4.6 + 做 E 组；9/16 背 4.7 + 模块六 + 做 F、G 组 + 核对全部答案。<br>说明：题组为自编模拟题（仿官方样题风格），和官方样题搭配使用。</p>\n</blockquote>\n<hr>\n","text":"配套科目：一级人工智能与大模型基础（科目代码 18） 用法： 第一部分先背 → 第二部分闭卷做题 → 第三部分翻到最后对答案 → 错题抄进「错题复记表」 安排：9/15 背 4.1–4.6 + 做 E 组；9/16 背 4.7 + 模块六 + 做 F、G 组 + 核对全部答案。 说明：题组为自编模拟题（仿官方样题风格），和官方样题搭配使用。","chars":171},{"id":"s1","title":"第一部分 · 知识点（先背这一半）","tab":"知识点","html":"<h2>模块四 算法与模型</h2>\n<h3>4.1 三种学习方式（必背第一张表）</h3>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>类型</th>\n<th>数据</th>\n<th>典型任务</th>\n<th>代表算法</th>\n<th>美术类比</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>监督学习</td>\n<td><strong>有标签</strong></td>\n<td>分类、回归</td>\n<td>决策树、KNN、线性回归、逻辑回归</td>\n<td>照着范画临摹</td>\n</tr>\n<tr>\n<td>无监督学习</td>\n<td><strong>无标签</strong></td>\n<td>聚类、降维</td>\n<td>K-Means</td>\n<td>自己把画作按风格分堆</td>\n</tr>\n<tr>\n<td>强化学习</td>\n<td>靠<strong>奖励反馈</strong>试错</td>\n<td>决策控制</td>\n<td>Q-Learning、AlphaGo</td>\n<td>老师点评，一边画一边改</td>\n</tr>\n</tbody></table></div>\n<p><strong>三个必背例子（考试原话级别）：</strong></p>\n<ul>\n<li>垃圾邮件识别（有标签）→ 监督学习（分类）</li>\n<li>用户自动分群（无标签）→ 无监督学习（聚类）</li>\n<li>AlphaGo 自我对弈（胜负反馈）→ 强化学习</li>\n</ul>\n<h3>4.2 分类 vs 回归（一句话分清）</h3>\n<ul>\n<li><strong>分类</strong>：输出<strong>类别</strong>——&quot;是什么&quot;。如：是不是垃圾邮件、有没有信用卡欺诈、图中是什么动物。</li>\n<li><strong>回归</strong>：输出<strong>连续数值</strong>——&quot;是多少&quot;。如：房价、身高、销量、温度。</li>\n<li>高频陷阱：<strong>逻辑回归是分类算法</strong>（名字骗人）；线性回归才是回归。</li>\n</ul>\n<h3>4.3 五个算法辨析表（选择题最爱考）</h3>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>算法</th>\n<th>类型</th>\n<th>一句话</th>\n<th>关键词</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>线性回归</td>\n<td>监督·回归</td>\n<td>用直线拟合数据，预测数值</td>\n<td>房价、销量、最小二乘</td>\n</tr>\n<tr>\n<td>逻辑回归</td>\n<td>监督·分类</td>\n<td>名字带&quot;回归&quot;，实际输出概率做分类</td>\n<td>是/否、概率、极大似然</td>\n</tr>\n<tr>\n<td>KNN</td>\n<td>监督·分类/回归</td>\n<td>看最近的 K 个邻居投票</td>\n<td>K＝参考的最近邻<strong>样本数量</strong></td>\n</tr>\n<tr>\n<td>K-Means</td>\n<td>无监督·聚类</td>\n<td>把数据自动分成 K 堆</td>\n<td>K＝<strong>簇（质心）数量</strong></td>\n</tr>\n<tr>\n<td>决策树</td>\n<td>监督·分类/回归</td>\n<td>一层层条件判断，过程透明</td>\n<td>可解释性强、放贷判断</td>\n</tr>\n</tbody></table></div>\n<p><strong>KNN vs K-Means 防坑（必背）：</strong></p>\n<ul>\n<li>KNN 的关键动作：<strong>&quot;选距离最近的 K 个样本&quot;</strong>——这是 KNN 的步骤，<strong>不是</strong> K-Means！</li>\n<li>K-Means 的步骤：初始化 K 个质心 → 把每个点分配给最近的质心 → 用簇内均值更新质心 → 迭代。</li>\n<li>一句话：<strong>KNN 看邻居，K-Means 找组织。</strong></li>\n</ul>\n<h3>4.4 数据划分与&quot;学得好不好&quot;</h3>\n<ul>\n<li>数据划分：训练集（练手）→ 验证集（调参）→ 测试集（期末考）。</li>\n<li><strong>过拟合</strong>：训练集极好、测试集明显变差（只会背这一张临摹，换个角度就崩）。缓解：增加数据、正则化、Dropout、早停。</li>\n<li><strong>欠拟合</strong>：训练集差、测试集也差（功底不够）。缓解：换更强模型、加特征。</li>\n<li><strong>召回率 ＝ 真正例 ÷ 实际正例总数</strong>（例：20 个病人识别出 18 个 → 90%）。</li>\n<li><strong>MSE 均方误差 ＝ 各误差平方的平均值</strong>（先求误差 → 平方 → 取平均）。</li>\n</ul>\n<h3>4.5 神经网络三兄弟（必背第二张表）</h3>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>网络</th>\n<th>擅长</th>\n<th>记忆钩子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>CNN 卷积神经网络</td>\n<td>图像、视觉任务</td>\n<td>看局部笔触拼整体（卷积＋池化）</td>\n</tr>\n<tr>\n<td>RNN 循环神经网络</td>\n<td>序列：文本、语音、时间序列</td>\n<td>一帧接一帧看动画，有&quot;记忆&quot;</td>\n</tr>\n<tr>\n<td>Transformer</td>\n<td>注意力机制，大模型底座（2017）</td>\n<td>一眼看全画面，理清元素关系</td>\n</tr>\n</tbody></table></div>\n<h3>4.6 生成式 AI 三件套</h3>\n<ul>\n<li>核心能力：<strong>从数据中创造新内容</strong>（文、图、音、视频），不是只做判断分类。</li>\n<li>代表技术：<strong>GAN、扩散模型、大语言模型</strong>。</li>\n<li>样题原题思路：&quot;动态生成个性化练习题&quot;是生成式；&quot;统计高频问题出报告&quot;只是统计。</li>\n</ul>\n<h3>4.7 统计计算专项（20 分填空里的那道，必拿）</h3>\n<p><strong>公式四连（按题目口径，方差/协方差除以个数 n）：</strong></p>\n<ol>\n<li><strong>均值</strong>：x̄ ＝ 所有 x 之和 ÷ n；同样算出 ȳ</li>\n<li><strong>方差</strong>：Var(x) ＝ Σ(xᵢ − x̄)² ÷ n</li>\n<li><strong>协方差</strong>：Cov(x,y) ＝ Σ(xᵢ − x̄)(yᵢ − ȳ) ÷ n</li>\n<li><strong>回归系数</strong>：a ＝ Cov(x,y) ÷ Var(x)；b ＝ ȳ − a·x̄</li>\n<li><strong>预测</strong>：把新的 x 代进 y ＝ ax ＋ b</li>\n</ol>\n<p><strong>手把手例子</strong>（考试第一步永远先算两个均值）：</p>\n<p>x：2, 4, 6, 8, 10（分钟）；y：3, 5.5, 8, 10.5, 13（%）</p>\n<ul>\n<li>x̄ ＝ 30 ÷ 5 ＝ 6；ȳ ＝ 40 ÷ 5 ＝ 8</li>\n<li>Var(x) ＝ (16＋4＋0＋4＋16) ÷ 5 ＝ <strong>8</strong></li>\n<li>Cov ＝ (20＋5＋0＋5＋20) ÷ 5 ＝ <strong>10</strong></li>\n<li>a ＝ 10 ÷ 8 ＝ <strong>1.25</strong>；b ＝ 8 − 1.25×6 ＝ <strong>0.5</strong></li>\n<li>预测 x＝7.2 时：y ＝ 1.25×7.2 ＋ 0.5 ＝ <strong>9.5%</strong></li>\n</ul>\n<p>（E4 是同套路换数字，做完对照；&quot;保留几位小数&quot;一定看清！）</p>\n<h3>4.8 背完自测清单（打勾）</h3>\n<ul>\n<li><input type=\"checkbox\" data-ck=\"nc1d2-1-0\"> 我能默写三种学习方式：有标签／无标签／奖励反馈</li>\n<li><input type=\"checkbox\" data-ck=\"nc1d2-1-1\"> 我能一句话区分 KNN 和 K-Means（邻居 vs 组织）</li>\n<li><input type=\"checkbox\" data-ck=\"nc1d2-1-2\"> 我记住了：逻辑回归是分类</li>\n<li><input type=\"checkbox\" data-ck=\"nc1d2-1-3\"> 我会算召回率和 MSE</li>\n<li><input type=\"checkbox\" data-ck=\"nc1d2-1-4\"> 我能背出统计计算链条：均值→方差→协方差→a、b→预测</li>\n<li><input type=\"checkbox\" data-ck=\"nc1d2-1-5\"> 我知道&quot;训练好、测试差＝过拟合&quot;和 4 种缓解方法</li>\n</ul>\n<hr>\n<h2>模块六 安全与伦理</h2>\n<h3>6.1 隐私保护三原则（必背）</h3>\n<ol>\n<li><strong>数据最小化</strong>：只收集实现功能所必需的数据（为&quot;提升推荐精度&quot;要身份证号、要家庭成员信息，都违背）。</li>\n<li><strong>授权同意</strong>：采集前告知并取得同意；涉及未成年人要监护人同意。</li>\n<li><strong>加密存储＋访问控制</strong>：敏感数据加密，权限管理、动态口令认证。</li>\n</ol>\n<p><strong>高频场景</strong>：智能音箱误采集未授权录音 → 正确做法：<strong>立即删除数据并关闭非必要采集功能</strong>。</p>\n<h3>6.2 算法偏见</h3>\n<ul>\n<li>来源：训练数据中的历史偏见、样本不平衡。</li>\n<li>危害：对特定群体不公平（如某些地区贷款通过率偏低）。</li>\n<li>缓解：<strong>公平性评估、定期统计检验</strong>——不是&quot;加大模型&quot;、也不是&quot;冻结数据不更新&quot;。</li>\n<li>样题原题：金融机构发现地域差异 → 定期对不同群体通过率做统计检验。</li>\n</ul>\n<h3>6.3 主要风险清单（背 6 个词）</h3>\n<p>幻觉 · 深度伪造 · 隐私泄露 · 算法偏见 · 版权争议 · 安全滥用（诈骗、虚假信息）</p>\n<ul>\n<li><strong>深度伪造（Deepfake）</strong>：AI 伪造人脸、声音；防范 ＝ 检测技术＋平台标识＋提高辨别能力。</li>\n</ul>\n<h3>6.4 伦理原则＋&quot;AI 是辅助&quot;</h3>\n<ul>\n<li>原则：以人为本、公平公正、<strong>透明可解释</strong>、安全可控、负责任。</li>\n<li>铁律：<strong>AI 是辅助工具，最终决策和责任由人承担</strong>（医疗、司法、信贷都一样）。</li>\n<li>反面选项：&quot;AI 完全替代人做决定&quot;&quot;无需解释&quot;&quot;AI 出错由模型负责&quot;→ 一律错。</li>\n</ul>\n<h3>6.5 使用规范三条（了解即可）</h3>\n<ul>\n<li>不把敏感个人信息、机密文件直接粘贴给公共 AI（先脱敏）。</li>\n<li>AI 生成内容需要<strong>标识</strong>（服务提供者/平台）。</li>\n<li>AI 生成的法律、医疗等结果，要<strong>人工核实</strong>后再使用。</li>\n</ul>\n<h3>6.6 背完自测清单（打勾）</h3>\n<ul>\n<li><input type=\"checkbox\" data-ck=\"nc1d2-1-6\"> 我能背出隐私三原则</li>\n<li><input type=\"checkbox\" data-ck=\"nc1d2-1-7\"> 我记得偏见要&quot;公平性评估/统计检验&quot;</li>\n<li><input type=\"checkbox\" data-ck=\"nc1d2-1-8\"> 我能背出 6 个风险词</li>\n<li><input type=\"checkbox\" data-ck=\"nc1d2-1-9\"> 我记得&quot;AI 是辅助，责任在人&quot;</li>\n</ul>\n<hr>\n","text":"模块四 算法与模型 4.1 三种学习方式（必背第一张表） 类型 数据 典型任务 代表算法 美术类比 监督学习 有标签 分类、回归 决策树、KNN、线性回归、逻辑回归 照着范画临摹 无监督学习 无标签 聚类、降维 K-Means 自己把画作按风格分堆 强化学习 靠 奖励反馈 试错 决策控制 Q-Learning、AlphaGo 老师点评，一边画一边改 三个必背例子（考试原话级别）： 垃圾邮件识别（有标签）→ 监督学习（分类） 用户自动分群（无标签）→ 无监督学习（聚类） AlphaGo 自我对弈（胜负反馈）→ 强化学习 4.2 分类 vs 回归（一句话分清） 分类 ：输出 类别 ——\"是什么\"。如：是不是垃圾邮件、有没有信用卡欺诈、图中是什么动物。 回归 ：输出 连续数值 ——\"是多少\"。如：房价、身高、销量、温度。 高频陷阱： 逻辑回归是分类算法 （名字骗人）；线性回归才是回归。 4.3 五个算法辨析表（选择题最爱考） 算法 类型 一句话 关键词 线性回归 监督·回归 用直线拟合数据，预测数值 房价、销量、最小二乘 逻辑回归 监督·分类 名字带\"回归\"，实际输出概率做分类 是/否、概率、极大似然 KNN 监督·分类/回归 看最近的 K 个邻居投票 K＝参考的最近邻 样本数量 K-Means 无监督·聚类 把数据自动分成 K 堆 K＝ 簇（质心）数量 决策树 监督·分类/回归 一层层条件判断，过程透明 可解释性强、放贷判断 KNN vs K-Means 防坑（必背）： KNN 的关键动作： \"选距离最近的 K 个样本\" ——这是 KNN 的步骤， 不是 K-Means！ K-Means 的步骤：初始化 K 个质心 → 把每个点分配给最近的质心 → 用簇内均值更新质心 → 迭代。 一句话： KNN 看邻居，K-Means 找组织。 4.4 数据划分与\"学得好不好\" 数据划分：训练集（练手）→ 验证集（调参）→ 测试集（期末考）。 过拟合 ：训练集极好、测试集明显变差（只会背这一张临摹，换个角度就崩）。缓解：增加数据、正则化、Dropout、早停。 欠拟合 ：训练集差、测试集也差（功底不够）。缓解：换更强模型、加特征。 召回率 ＝ 真正例 ÷ 实际正例总数 （例：20 个病人识别出 18 个 → 90%）。 MSE 均方误差 ＝ 各误差平方的平均值 （先求误差 → 平方 → 取平均）。 4.5 神经网络三兄弟（必背第二张表） 网络 擅长 记忆钩子 CNN 卷积神经网络 图像、视觉任务 看局部笔触拼整体（卷积＋池化） RNN 循环神经网络 序列：文本、语音、时间序列 一帧接一帧看动画，有\"记忆\" Transformer 注意力机制，大模型底座（2017） 一眼看全画面，理清元素关系 4.6 生成式 AI 三件套 核心能力： 从数据中创造新内容 （文、图、音、视频），不是只做判断分类。 代表技术： GAN、扩散模型、大语言模型 。 样题原题思路：\"动态生成个性化练习题\"是生成式；\"统计高频问题出报告\"只是统计。 4.7 统计计算专项（20 分填空里的那道，必拿） 公式四连（按题目口径，方差/协方差除以个数 n）： 均值 ：x̄ ＝ 所有 x 之和 ÷ n；同样算出 ȳ 方差 ：Var(x) ＝ Σ(xᵢ − x̄)² ÷ n 协方差 ：Cov(x,y) ＝ Σ(xᵢ − x̄)(yᵢ − ȳ) ÷ n 回归系数 ：a ＝ Cov(x,y) ÷ Var(x)；b ＝ ȳ − a·x̄ 预测 ：把新的 x 代进 y ＝ ax ＋ b 手把手例子 （考试第一步永远先算两个均值）： x：2, 4, 6, 8, 10（分钟）；y：3, 5.5, 8, 10.5, 13（%） x̄ ＝ 30 ÷ 5 ＝ 6；ȳ ＝ 40 ÷ 5 ＝ 8 Var(x) ＝ (16＋4＋0＋4＋16) ÷ 5 ＝ 8 Cov ＝ (20＋5＋0＋5＋20) ÷ 5 ＝ 10 a ＝ 10 ÷ 8 ＝ 1.25 ；b ＝ 8 − 1.25×6 ＝ 0.5 预测 x＝7.2 时：y ＝ 1.25×7.2 ＋ 0.5 ＝ 9.5% （E4 是同套路换数字，做完对照；\"保留几位小数\"一定看清！） 4.8 背完自测清单（打勾） 我能默写三种学习方式：有标签／无标签／奖励反馈 我能一句话区分 KNN 和 K-Means（邻居 vs 组织） 我记住了：逻辑回归是分类 我会算召回率和 MSE 我能背出统计计算链条：均值→方差→协方差→a、b→预测 我知道\"训练好、测试差＝过拟合\"和 4 种缓解方法 模块六 安全与伦理 6.1 隐私保护三原则（必背） 数据最小化 ：只收集实现功能所必需的数据（为\"提升推荐精度\"要身份证号、要家庭成员信息，都违背）。 授权同意 ：采集前告知并取得同意；涉及未成年人要监护人同意。 加密存储＋访问控制 ：敏感数据加密，权限管理、动态口令认证。 高频场景 ：智能音箱误采集未授权录音 → 正确做法： 立即删除数据并关闭非必要采集功能 。 6.2 算法偏见 来源：训练数据中的历史偏见、样本不平衡。 危害：对特定群体不公平（如某些地区贷款通过率偏低）。 缓解： 公平性评估、定期统计检验 ——不是\"加大模型\"、也不是\"冻结数据不更新\"。 样题原题：金融机构发现地域差异 → 定期对不同群体通过率做统计检验。 6.3 主要风险清单（背 6 个词） 幻觉 · 深度伪造 · 隐私泄露 · 算法偏见 · 版权争议 · 安全滥用（诈骗、虚假信息） 深度伪造（Deepfake） ：AI 伪造人脸、声音；防范 ＝ 检测技术＋平台标识＋提高辨别能力。 6.4 伦理原则＋\"AI 是辅助\" 原则：以人为本、公平公正、 透明可解释 、安全可控、负责任。 铁律： AI 是辅助工具，最终决策和责任由人承担 （医疗、司法、信贷都一样）。 反面选项：\"AI 完全替代人做决定\"\"无需解释\"\"AI 出错由模型负责\"→ 一律错。 6.5 使用规范三条（了解即可） 不把敏感个人信息、机密文件直接粘贴给公共 AI（先脱敏）。 AI 生成内容需要 标识 （服务提供者/平台）。 AI 生成的法律、医疗等结果，要 人工核实 后再使用。 6.6 背完自测清单（打勾） 我能背出隐私三原则 我记得偏见要\"公平性评估/统计检验\" 我能背出 6 个风险词 我记得\"AI 是辅助，责任在人\"","chars":2644},{"id":"s2","title":"第二部分 · 练习题（闭卷做，别看答案）","tab":"练习题","html":"<blockquote>\n<p>建议：单选每题 1 分钟、多选每题 2 分钟、判断 30 秒、E4 计算 10 分钟。</p>\n</blockquote>\n<h2>E 组 · 算法</h2>\n<h3>E1 单项选择题（12 题）</h3>\n<ol>\n<li><p>让模型在带有&quot;垃圾邮件/正常邮件&quot;标签的数据上学习识别垃圾邮件，属于：<br>A）监督学习<br>B）无监督学习<br>C）强化学习<br>D）迁移学习</p>\n</li>\n<li><p>电商把用户按消费习惯自动分成若干群体，事先没有任何分组标签，这属于：<br>A）监督学习中的分类<br>B）无监督学习中的聚类<br>C）强化学习<br>D）监督学习中的回归</p>\n</li>\n<li><p>AlphaGo 通过自我对弈、以胜负作为反馈不断提升棋力，这种学习方式属于：<br>A）监督学习<br>B）无监督学习<br>C）强化学习<br>D）半监督学习</p>\n</li>\n<li><p>KNN 算法中&quot;K&quot;的含义是：<br>A）数据类别的数量<br>B）预测时需参考的最近邻样本数量<br>C）随机选取的初始点数量<br>D）迭代次数</p>\n</li>\n<li><p>以下<strong>不属于</strong> K-Means 算法关键步骤的是：<br>A）初始化 K 个质心<br>B）把每个数据点分配给最近的质心<br>C）选择距离最近的 K 个训练样本<br>D）用簇内均值更新质心</p>\n</li>\n<li><p>银行分析师根据年龄、收入、房产状况等条件判断是否发放贷款，最直观、可解释性最强的算法是：<br>A）线性回归<br>B）K-Means<br>C）决策树<br>D）卷积神经网络</p>\n</li>\n<li><p>名字带&quot;回归&quot;、实际却用于分类并输出概率的算法是：<br>A）一元线性回归<br>B）逻辑回归<br>C）K-Means<br>D）主成分分析</p>\n</li>\n<li><p>预测&quot;下周某商品的具体销量数值&quot;，属于机器学习中的：<br>A）分类问题<br>B）聚类问题<br>C）回归问题<br>D）强化学习问题</p>\n</li>\n<li><p>模型在训练数据上误差极低，但在测试数据上误差明显升高，这种现象称为：<br>A）过拟合<br>B）欠拟合<br>C）数据泄露<br>D）梯度消失</p>\n</li>\n<li><p>最适合处理文本、语音这类序列数据、具有&quot;记忆&quot;能力的网络是：<br>A）CNN<br>B）GAN<br>C）KNN<br>D）RNN</p>\n</li>\n<li><p>某医疗模型对 100 名患者做预测，真实患病 20 人，其中被正确识别出 18 人，该模型的召回率是：<br>A）25%<br>B）18%<br>C）90%<br>D）78.3%</p>\n</li>\n<li><p>某模型预测 4 个商品销量，真实值为 100、200、300、400，预测值为 90、190、320、410，其均方误差 MSE 是：<br>A）100<br>B）175<br>C）700<br>D）250</p>\n</li>\n</ol>\n<h3>E2 多项选择题（4 题，每题 5 个选项）</h3>\n<ol>\n<li><p>关于三种学习方式，下列说法正确的有：<br>A）监督学习使用带标签的数据<br>B）无监督学习的典型任务是聚类<br>C）强化学习依靠奖励反馈进行试错学习<br>D）K-Means 属于监督学习<br>E）监督学习只能做分类，不能做回归</p>\n</li>\n<li><p>关于人工智能典型算法，下列说法正确的有：<br>A）决策树可以直观展示决策过程<br>B）KNN 的 K 是预测时参考的最近邻样本数量<br>C）逻辑回归输出概率值或类别标签<br>D）线性回归主要用于预测连续数值<br>E）K-Means 属于监督学习算法</p>\n</li>\n<li><p>关于神经网络，下列说法正确的有：<br>A）CNN 适合图像分类等视觉任务<br>B）RNN 更适合处理序列数据<br>C）Transformer 基于注意力机制，是大模型的底座<br>D）CNN 只能处理文字<br>E）CNN 的核心操作包括卷积和池化</p>\n</li>\n<li><p>可以缓解过拟合的方法有：<br>A）增加训练数据<br>B）正则化<br>C）Dropout<br>D）早停<br>E）把模型加深加大、参数更多</p>\n</li>\n</ol>\n<h3>E3 判断题（3 题）</h3>\n<ol>\n<li>逻辑回归虽然名字带&quot;回归&quot;，但主要用于分类。（ ）</li>\n<li>K-Means 聚类的第一步是&quot;选择距离最近的 K 个样本&quot;。（ ）</li>\n<li>训练集表现差、测试集也差，说明模型欠拟合。（ ）</li>\n</ol>\n<h3>E4 统计计算填空（1 题，共 6 空）</h3>\n<p>某直播团队研究&quot;直播时长与转化率&quot;的关系，5 场直播数据如下：</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>场次</th>\n<th>1</th>\n<th>2</th>\n<th>3</th>\n<th>4</th>\n<th>5</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>直播时长 x（小时）</td>\n<td>1</td>\n<td>2</td>\n<td>3</td>\n<td>4</td>\n<td>5</td>\n</tr>\n<tr>\n<td>转化率 y（%）</td>\n<td>4</td>\n<td>5</td>\n<td>8</td>\n<td>8</td>\n<td>10</td>\n</tr>\n</tbody></table></div>\n<p>假设线性回归模型 y ＝ ax ＋ b，方差、协方差按除以个数 n 计算。请完成填空（先算两个均值！）：</p>\n<p>（1）x̄ ＝ ______ 小时；<br>（2）Var(x) ＝ ______；<br>（3）Cov(x,y) ＝ ______；<br>（4）a ＝ Cov(x,y) ÷ Var(x) ＝ ______；<br>（5）b ＝ ȳ − a·x̄ ＝ ______；<br>（6）按模型预测：当直播时长为 6 小时时，转化率约为 ______%。</p>\n<hr>\n<h2>F 组 · 安全</h2>\n<h3>F1 单项选择题（8 题）</h3>\n<ol>\n<li><p>某智能音箱误采集了用户未授权的对话录音，正确的处理方式是：<br>A）加密存储后用于改进语音识别模型<br>B）立即删除该数据并关闭非必要的采集功能<br>C）通知用户后继续使用这些数据<br>D）停止采集，但保留已获取的数据</p>\n</li>\n<li><p>下列做法中最符合&quot;数据最小化原则&quot;的是：<br>A）为提升推荐精度要求用户提供身份证号<br>B）要求用户人脸识别以确认身份<br>C）只采集实现功能所必需的数据<br>D）采集家庭成员信息以分析家庭偏好</p>\n</li>\n<li><p>医院 AI 系统处理包含患者敏感信息的历史电子病历时，最符合隐私保护要求的措施是：<br>A）对病历中身份信息加密，并对访问实施动态口令认证<br>B）使用数据压缩技术保存患者的 X 光片<br>C）要求患者每次就诊更换用户名和密码<br>D）将病历明文存放在公共云盘统一管理</p>\n</li>\n<li><p>某金融机构发现信贷模型对特定地域群体的审批通过率存在差异，最能有效减少算法偏见的措施是：<br>A）锁定初始训练数据，禁止模型更新<br>B）根据用户操作频率动态调整模型响应速度<br>C）要求申请人补充提交家庭成员的信用记录<br>D）定期对不同地域群体的审批通过率做统计检验</p>\n</li>\n<li><p>AI 生成的以假乱真的换脸视频、伪造声音，这一类风险称为：<br>A）过拟合<br>B）深度伪造<br>C）知识截止<br>D）数据清洗</p>\n</li>\n<li><p>关于人工智能伦理，下列说法正确的是：<br>A）AI 应作为辅助工具，最终决策和责任由人承担<br>B）AI 准确率高后可以完全替代医生做最终诊断<br>C）AI 的决策过程不需要向用户解释<br>D）只要效率高，就可以忽略隐私问题</p>\n</li>\n<li><p>需要使用公共大模型处理一份含客户信息的机密文件，最规范的做法是：<br>A）直接粘贴全部原文让模型总结<br>B）截图后上传让模型识别<br>C）先脱敏、删除敏感信息后再处理<br>D）公司机密无所谓，方便优先</p>\n</li>\n<li><p>大模型给出的法律条文解释与官方文件不一致，正确做法是：<br>A）直接采信模型的说法<br>B）让模型再回答一遍就采信<br>C）把模型结果原样转发给客户<br>D）人工核实官方来源后再使用</p>\n</li>\n</ol>\n<h3>F2 多项选择题（4 题，每题 5 个选项）</h3>\n<ol>\n<li><p>下列应用场景可能引发个人隐私泄露风险的有：<br>A）智能音箱误唤醒后持续录音并上传云端<br>B）游戏 App 强制要求人脸信息作为唯一登录验证方式<br>C）社交平台使用聊天记录关键词定向推送广告且未告知用户<br>D）教育平台根据学生答题记录推送同类习题<br>E）在公共云盘公开分享含身份证号的截图</p>\n</li>\n<li><p>关于隐私保护，正确的做法有：<br>A）遵循数据最小化，只收集必要信息<br>B）采集前取得用户授权同意<br>C）敏感数据加密存储<br>D）建立访问控制和权限管理<br>E）为&quot;以后可能有用&quot;，尽可能多收集用户数据</p>\n</li>\n<li><p>关于算法偏见，下列说法正确的有：<br>A）可能来自训练数据中的历史偏见<br>B）可通过公平性评估与统计检验来发现和缓解<br>C）只要把模型参数加大就能彻底消除偏见<br>D）偏见可能使特定群体受到不公平对待<br>E）算法偏见与训练数据无关</p>\n</li>\n<li><p>关于深度伪造（Deepfake），下列说法正确的有：<br>A）可以利用 AI 技术伪造人脸和声音<br>B）可能被用于诈骗和制造虚假信息<br>C）应借助检测技术核实，提高公众辨别能力<br>D）深度伪造内容一定能被肉眼立刻分辨<br>E）平台可以对疑似 AI 生成内容进行标识</p>\n</li>\n</ol>\n<h3>F3 判断题（2 题）</h3>\n<ol>\n<li>AI 系统可以完全替代人类做出最终的医疗诊断决策。（ ）</li>\n<li>发现 AI 系统存在算法偏见时，应通过公平性评估等方式持续监测和改进。（ ）</li>\n</ol>\n<h3>F4 场景填空（1 题，共 5 空）</h3>\n<p>某教育 App 准备上线&quot;AI 学习助手&quot;，计划采集用户的姓名、手机号、身份证号、家庭住址等信息。</p>\n<p>（1）只采集实现功能所必需的信息，体现的是 ______ 原则；<br>（2）采集个人信息前，应取得用户的 ______；<br>（3）敏感信息在数据库中应当 ______ 存储，并设置访问权限；<br>（4）上线后发现系统对不同地区学生的推荐结果差异明显，这属于 ______ 问题；<br>（5）为持续发现并缓解这一问题，应定期开展 ______ 评估（或统计检验）。</p>\n<hr>\n<h2>G 组 · 综合应用（6 题，模拟真题场景风格）</h2>\n<ol>\n<li><p>某画室用 AI 给作品打分：在训练用作品上评分与老师几乎一致，但换成新作品后评分经常离谱。最合理的改进方向是：<br>A）继续让模型背诵更多训练作品<br>B）把评分标准改得更简单<br>C）增加更多样化的训练作品，并配合正则化等手段<br>D）让模型只学颜色特征</p>\n</li>\n<li><p>美术馆想把 5000 张观众投稿&quot;自动分成若干风格流派&quot;，事先没有任何风格标签。最合适的方法是：<br>A）KNN 分类<br>B）K-Means 聚类<br>C）线性回归预测<br>D）决策树分类</p>\n</li>\n<li><p>摄影社团想让 AI 自动识别照片中&quot;有没有动物、是什么动物&quot;，已有大量人工标注照片。最合适的模型是：<br>A）RNN<br>B）K-Means<br>C）CNN<br>D）线性回归</p>\n</li>\n<li><p>健身 App 想用 AI 分析用户体态视频（画面含人脸），用户中包含未成年人。最规范的做法是：<br>A）默认上传所有人脸视频，加快模型训练<br>B）把视频卖给第三方换取算力<br>C）只删除用户名就算完成脱敏<br>D）取得用户（未成年人经监护人）同意，只采集必要数据并加密存储</p>\n</li>\n<li><p>网上流传一段&quot;某名人代言产品&quot;的视频，口型与声音略有违和。正确做法是：<br>A）立刻转发提醒别人小心<br>B）通过官方渠道核实后再决定，谨慎转发<br>C）画质高清就可以相信<br>D）下载后用修图软件加滤镜再发布</p>\n</li>\n<li><p>关于 AI 辅助诊断系统，下列说法正确的是：<br>A）医生的最终判断与责任不能被 AI 替代<br>B）AI 准确率高就可以免去医生复核<br>C）AI 出错时由模型自己承担责任<br>D）患者无需知道诊疗过程中使用了 AI</p>\n</li>\n</ol>\n<hr>\n","text":"建议：单选每题 1 分钟、多选每题 2 分钟、判断 30 秒、E4 计算 10 分钟。 E 组 · 算法 E1 单项选择题（12 题） 让模型在带有\"垃圾邮件/正常邮件\"标签的数据上学习识别垃圾邮件，属于： A）监督学习 B）无监督学习 C）强化学习 D）迁移学习 电商把用户按消费习惯自动分成若干群体，事先没有任何分组标签，这属于： A）监督学习中的分类 B）无监督学习中的聚类 C）强化学习 D）监督学习中的回归 AlphaGo 通过自我对弈、以胜负作为反馈不断提升棋力，这种学习方式属于： A）监督学习 B）无监督学习 C）强化学习 D）半监督学习 KNN 算法中\"K\"的含义是： A）数据类别的数量 B）预测时需参考的最近邻样本数量 C）随机选取的初始点数量 D）迭代次数 以下 不属于 K-Means 算法关键步骤的是： A）初始化 K 个质心 B）把每个数据点分配给最近的质心 C）选择距离最近的 K 个训练样本 D）用簇内均值更新质心 银行分析师根据年龄、收入、房产状况等条件判断是否发放贷款，最直观、可解释性最强的算法是： A）线性回归 B）K-Means C）决策树 D）卷积神经网络 名字带\"回归\"、实际却用于分类并输出概率的算法是： A）一元线性回归 B）逻辑回归 C）K-Means D）主成分分析 预测\"下周某商品的具体销量数值\"，属于机器学习中的： A）分类问题 B）聚类问题 C）回归问题 D）强化学习问题 模型在训练数据上误差极低，但在测试数据上误差明显升高，这种现象称为： A）过拟合 B）欠拟合 C）数据泄露 D）梯度消失 最适合处理文本、语音这类序列数据、具有\"记忆\"能力的网络是： A）CNN B）GAN C）KNN D）RNN 某医疗模型对 100 名患者做预测，真实患病 20 人，其中被正确识别出 18 人，该模型的召回率是： A）25% B）18% C）90% D）78.3% 某模型预测 4 个商品销量，真实值为 100、200、300、400，预测值为 90、190、320、410，其均方误差 MSE 是： A）100 B）175 C）700 D）250 E2 多项选择题（4 题，每题 5 个选项） 关于三种学习方式，下列说法正确的有： A）监督学习使用带标签的数据 B）无监督学习的典型任务是聚类 C）强化学习依靠奖励反馈进行试错学习 D）K-Means 属于监督学习 E）监督学习只能做分类，不能做回归 关于人工智能典型算法，下列说法正确的有： A）决策树可以直观展示决策过程 B）KNN 的 K 是预测时参考的最近邻样本数量 C）逻辑回归输出概率值或类别标签 D）线性回归主要用于预测连续数值 E）K-Means 属于监督学习算法 关于神经网络，下列说法正确的有： A）CNN 适合图像分类等视觉任务 B）RNN 更适合处理序列数据 C）Transformer 基于注意力机制，是大模型的底座 D）CNN 只能处理文字 E）CNN 的核心操作包括卷积和池化 可以缓解过拟合的方法有： A）增加训练数据 B）正则化 C）Dropout D）早停 E）把模型加深加大、参数更多 E3 判断题（3 题） 逻辑回归虽然名字带\"回归\"，但主要用于分类。（ ） K-Means 聚类的第一步是\"选择距离最近的 K 个样本\"。（ ） 训练集表现差、测试集也差，说明模型欠拟合。（ ） E4 统计计算填空（1 题，共 6 空） 某直播团队研究\"直播时长与转化率\"的关系，5 场直播数据如下： 场次 1 2 3 4 5 直播时长 x（小时） 1 2 3 4 5 转化率 y（%） 4 5 8 8 10 假设线性回归模型 y ＝ ax ＋ b，方差、协方差按除以个数 n 计算。请完成填空（先算两个均值！）： （1）x̄ ＝ ______ 小时； （2）Var(x) ＝ ______； （3）Cov(x,y) ＝ ______； （4）a ＝ Cov(x,y) ÷ Var(x) ＝ ______； （5）b ＝ ȳ − a·x̄ ＝ ______； （6）按模型预测：当直播时长为 6 小时时，转化率约为 ______%。 F 组 · 安全 F1 单项选择题（8 题） 某智能音箱误采集了用户未授权的对话录音，正确的处理方式是： A）加密存储后用于改进语音识别模型 B）立即删除该数据并关闭非必要的采集功能 C）通知用户后继续使用这些数据 D）停止采集，但保留已获取的数据 下列做法中最符合\"数据最小化原则\"的是： A）为提升推荐精度要求用户提供身份证号 B）要求用户人脸识别以确认身份 C）只采集实现功能所必需的数据 D）采集家庭成员信息以分析家庭偏好 医院 AI 系统处理包含患者敏感信息的历史电子病历时，最符合隐私保护要求的措施是： A）对病历中身份信息加密，并对访问实施动态口令认证 B）使用数据压缩技术保存患者的 X 光片 C）要求患者每次就诊更换用户名和密码 D）将病历明文存放在公共云盘统一管理 某金融机构发现信贷模型对特定地域群体的审批通过率存在差异，最能有效减少算法偏见的措施是： A）锁定初始训练数据，禁止模型更新 B）根据用户操作频率动态调整模型响应速度 C）要求申请人补充提交家庭成员的信用记录 D）定期对不同地域群体的审批通过率做统计检验 AI 生成的以假乱真的换脸视频、伪造声音，这一类风险称为： A）过拟合 B）深度伪造 C）知识截止 D）数据清洗 关于人工智能伦理，下列说法正确的是： A）AI 应作为辅助工具，最终决策和责任由人承担 B）AI 准确率高后可以完全替代医生做最终诊断 C）AI 的决策过程不需要向用户解释 D）只要效率高，就可以忽略隐私问题 需要使用公共大模型处理一份含客户信息的机密文件，最规范的做法是： A）直接粘贴全部原文让模型总结 B）截图后上传让模型识别 C）先脱敏、删除敏感信息后再处理 D）公司机密无所谓，方便优先 大模型给出的法律条文解释与官方文件不一致，正确做法是： A）直接采信模型的说法 B）让模型再回答一遍就采信 C）把模型结果原样转发给客户 D）人工核实官方来源后再使用 F2 多项选择题（4 题，每题 5 个选项） 下列应用场景可能引发个人隐私泄露风险的有： A）智能音箱误唤醒后持续录音并上传云端 B）游戏 App 强制要求人脸信息作为唯一登录验证方式 C）社交平台使用聊天记录关键词定向推送广告且未告知用户 D）教育平台根据学生答题记录推送同类习题 E）在公共云盘公开分享含身份证号的截图 关于隐私保护，正确的做法有： A）遵循数据最小化，只收集必要信息 B）采集前取得用户授权同意 C）敏感数据加密存储 D）建立访问控制和权限管理 E）为\"以后可能有用\"，尽可能多收集用户数据 关于算法偏见，下列说法正确的有： A）可能来自训练数据中的历史偏见 B）可通过公平性评估与统计检验来发现和缓解 C）只要把模型参数加大就能彻底消除偏见 D）偏见可能使特定群体受到不公平对待 E）算法偏见与训练数据无关 关于深度伪造（Deepfake），下列说法正确的有： A）可以利用 AI 技术伪造人脸和声音 B）可能被用于诈骗和制造虚假信息 C）应借助检测技术核实，提高公众辨别能力 D）深度伪造内容一定能被肉眼立刻分辨 E）平台可以对疑似 AI 生成内容进行标识 F3 判断题（2 题） AI 系统可以完全替代人类做出最终的医疗诊断决策。（ ） 发现 AI 系统存在算法偏见时，应通过公平性评估等方式持续监测和改进。（ ） F4 场景填空（1 题，共 5 空） 某教育 App 准备上线\"AI 学习助手\"，计划采集用户的姓名、手机号、身份证号、家庭住址等信息。 （1）只采集实现功能所必需的信息，体现的是 ______ 原则； （2）采集个人信息前，应取得用户的 ______； （3）敏感信息在数据库中应当 ______ 存储，并设置访问权限； （4）上线后发现系统对不同地区学生的推荐结果差异明显，这属于 ______ 问题； （5）为持续发现并缓解这一问题，应定期开展 ______ 评估（或统计检验）。 G 组 · 综合应用（6 题，模拟真题场景风格） 某画室用 AI 给作品打分：在训练用作品上评分与老师几乎一致，但换成新作品后评分经常离谱。最合理的改进方向是： A）继续让模型背诵更多训练作品 B）把评分标准改得更简单 C）增加更多样化的训练作品，并配合正则化等手段 D）让模型只学颜色特征 美术馆想把 5000 张观众投稿\"自动分成若干风格流派\"，事先没有任何风格标签。最合适的方法是： A）KNN 分类 B）K-Means 聚类 C）线性回归预测 D）决策树分类 摄影社团想让 AI 自动识别照片中\"有没有动物、是什么动物\"，已有大量人工标注照片。最合适的模型是： A）RNN B）K-Means C）CNN D）线性回归 健身 App 想用 AI 分析用户体态视频（画面含人脸），用户中包含未成年人。最规范的做法是： A）默认上传所有人脸视频，加快模型训练 B）把视频卖给第三方换取算力 C）只删除用户名就算完成脱敏 D）取得用户（未成年人经监护人）同意，只采集必要数据并加密存储 网上流传一段\"某名人代言产品\"的视频，口型与声音略有违和。正确做法是： A）立刻转发提醒别人小心 B）通过官方渠道核实后再决定，谨慎转发 C）画质高清就可以相信 D）下载后用修图软件加滤镜再发布 关于 AI 辅助诊断系统，下列说法正确的是： A）医生的最终判断与责任不能被 AI 替代 B）AI 准确率高就可以免去医生复核 C）AI 出错时由模型自己承担责任 D）患者无需知道诊疗过程中使用了 AI","chars":4005},{"id":"s3","title":"第三部分 · 答案与核对（做完再看！）","tab":"答案与核对","html":"<h2>E 组答案</h2>\n<h3>E1 单选</h3>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>题号</th>\n<th>答案</th>\n<th>速记点</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td>A</td>\n<td>有标签 → 监督学习</td>\n</tr>\n<tr>\n<td>2</td>\n<td>B</td>\n<td>无标签分组 → 无监督·聚类</td>\n</tr>\n<tr>\n<td>3</td>\n<td>C</td>\n<td>奖励反馈试错 → 强化学习</td>\n</tr>\n<tr>\n<td>4</td>\n<td>B</td>\n<td>KNN 的 K＝参考的最近邻样本数量</td>\n</tr>\n<tr>\n<td>5</td>\n<td>C</td>\n<td>&quot;选最近的 K 个样本&quot;是 KNN 的步骤</td>\n</tr>\n<tr>\n<td>6</td>\n<td>C</td>\n<td>多条件、要可解释 → 决策树</td>\n</tr>\n<tr>\n<td>7</td>\n<td>B</td>\n<td>逻辑回归＝名字骗人的分类算法</td>\n</tr>\n<tr>\n<td>8</td>\n<td>C</td>\n<td>预测具体数值 → 回归</td>\n</tr>\n<tr>\n<td>9</td>\n<td>A</td>\n<td>训练好、测试差 → 过拟合</td>\n</tr>\n<tr>\n<td>10</td>\n<td>D</td>\n<td>序列数据、有记忆 → RNN</td>\n</tr>\n<tr>\n<td>11</td>\n<td>C</td>\n<td>召回率＝18÷20＝90%</td>\n</tr>\n<tr>\n<td>12</td>\n<td>B</td>\n<td>MSE＝(100＋100＋400＋100)÷4＝175</td>\n</tr>\n</tbody></table></div>\n<h3>E2 多选</h3>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>题号</th>\n<th>答案</th>\n<th>速记点</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td>ABC</td>\n<td>D 错：K-Means 是无监督；E 错：监督也能做回归</td>\n</tr>\n<tr>\n<td>2</td>\n<td>ABCD</td>\n<td>E 错：K-Means 是无监督聚类</td>\n</tr>\n<tr>\n<td>3</td>\n<td>ABCE</td>\n<td>D 错：CNN 管图像不管文字</td>\n</tr>\n<tr>\n<td>4</td>\n<td>ABCD</td>\n<td>E 错：模型越复杂越容易过拟合</td>\n</tr>\n</tbody></table></div>\n<h3>E3 判断</h3>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>题号</th>\n<th>答案</th>\n<th>解析</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td>对</td>\n<td>逻辑回归实际做分类，输出概率</td>\n</tr>\n<tr>\n<td>2</td>\n<td>错</td>\n<td>那是 KNN 的步骤；K-Means 先初始化 K 个质心</td>\n</tr>\n<tr>\n<td>3</td>\n<td>对</td>\n<td>两个都差＝欠拟合</td>\n</tr>\n</tbody></table></div>\n<h3>E4 统计计算填空</h3>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>空</th>\n<th>答案</th>\n<th>计算过程</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>（1）</td>\n<td>3</td>\n<td>x̄＝(1＋2＋3＋4＋5)÷5＝3</td>\n</tr>\n<tr>\n<td>（2）</td>\n<td>2</td>\n<td>Var＝(4＋1＋0＋1＋4)÷5＝2</td>\n</tr>\n<tr>\n<td>（3）</td>\n<td>3</td>\n<td>Cov＝(6＋2＋0＋1＋6)÷5＝3</td>\n</tr>\n<tr>\n<td>（4）</td>\n<td>1.5</td>\n<td>a＝3÷2＝1.5</td>\n</tr>\n<tr>\n<td>（5）</td>\n<td>2.5</td>\n<td>ȳ＝35÷5＝7；b＝7−1.5×3＝2.5</td>\n</tr>\n<tr>\n<td>（6）</td>\n<td>11.5</td>\n<td>y＝1.5×6＋2.5＝11.5</td>\n</tr>\n</tbody></table></div>\n<h2>F 组答案</h2>\n<h3>F1 单选</h3>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>题号</th>\n<th>答案</th>\n<th>速记点</th>\n</tr>\n</t
