<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>学习 App · 高保真原型</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#111214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="学习 App">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="icon" href="./icon.svg">
<style>/* ===== 学习 App 高保真原型 · 样式 ===== */
:root{
  --ink:#111214;
  --ink-2:#3c3f44;
  --ink-3:#7c8189;
  --ink-4:#a9aeb6;
  --line:#eceef1;
  --line-2:#e2e5e9;
  --chip:#f3f4f6;
  --bg:#ffffff;
  --bg-soft:#fafbfc;
  --accent:#111214;
  --radius:20px;
  --shadow:0 1px 2px rgba(16,18,20,.04), 0 8px 24px rgba(16,18,20,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background:#eceef1;
  -webkit-font-smoothing:antialiased;
}

/* ===== 桌面：左侧原型导航 + 中间手机框 ===== */
.stage{display:flex;min-height:100%;align-items:stretch}
.board{
  width:268px;flex:0 0 268px;padding:26px 18px 40px 26px;overflow:auto;
}
.board h1{font-size:15px;margin:0 0 2px;letter-spacing:-.2px}
.board .board-sub{font-size:11.5px;color:var(--ink-3);margin-bottom:18px;line-height:1.6}
.board .grp{font-size:10.5px;letter-spacing:.14em;color:var(--ink-4);margin:20px 0 8px;text-transform:uppercase}
.board a.nav{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;
  font-size:12.5px;color:var(--ink-2);text-decoration:none;line-height:1.3;
}
.board a.nav:hover{background:rgba(0,0,0,.045)}
.board a.nav.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.board a.nav span.dot{width:5px;height:5px;border-radius:50%;background:var(--ink-4);flex:0 0 5px}
.board a.nav.on span.dot{background:var(--ink)}
.board .foot{margin-top:22px;font-size:11px;color:var(--ink-4);line-height:1.7}
.board .foot code{background:rgba(0,0,0,.05);padding:1px 5px;border-radius:5px;font-size:10.5px}

.phoneWrap{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:26px 26px 26px 0;min-width:0}
.phone{
  position:relative;width:412px;height:868px;max-height:calc(100vh - 52px);
  background:#000;border-radius:46px;padding:11px;box-shadow:0 30px 70px rgba(16,18,20,.28), 0 2px 6px rgba(16,18,20,.2);
}
.screen{
  position:relative;width:100%;height:100%;background:var(--bg);border-radius:36px;overflow:hidden;
  display:flex;flex-direction:column;
}
.notch{
  position:absolute;top:11px;left:50%;transform:translateX(-50%);width:112px;height:26px;background:#000;
  border-radius:0 0 16px 16px;z-index:60;
}
.statusbar{
  height:38px;flex:0 0 38px;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;font-size:12.5px;font-weight:600;letter-spacing:.2px;color:var(--ink);
}
.statusbar .icons{display:flex;align-items:center;gap:5px}
.view{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;background:var(--bg);scroll-behavior:smooth}
.view.noscroll{overflow:hidden}
.view::-webkit-scrollbar{width:0}

/* ===== 页面通用 ===== */
.page{padding:6px 20px 118px}
.hdr{display:flex;align-items:flex-start;gap:12px;padding:8px 20px 4px}
.hdr .h1{font-size:30px;font-weight:800;letter-spacing:-.9px;margin:0;line-height:1.12}
.hdr .sub{font-size:12.5px;color:var(--ink-3);margin-top:7px}
.hdr .acts{margin-left:auto;display:flex;gap:14px;align-items:center;color:var(--ink);padding-top:6px}
.iconbtn{background:none;border:0;padding:0;display:grid;place-items:center;color:inherit;cursor:pointer}
/* 内联 SVG 统一尺寸（漏一个尺寸就会撑爆布局） */
.iconbtn svg{width:21px;height:21px}
.tabbar button svg{width:22px;height:22px}
.rfoot button svg{width:21px;height:21px}
.hdr .acts svg{width:21px;height:21px}
.quote svg{width:17px;height:17px;flex:0 0 17px}
.sect .h svg{width:15px;height:15px}
.answerGate svg{width:17px;height:17px;flex:0 0 17px}
.fab svg{width:22px;height:22px}
/* 小鲸鱼悬浮按钮（AI 入口）：白底 + 蓝鲸，跟你的参考图一致 */
.fab.aiFab{background:#fff;color:#4d6bfe;border:1px solid rgba(16,18,20,.06);box-shadow:0 8px 22px rgba(16,18,20,.18)}
.fab.aiFab svg{width:30px;height:30px}
.fab.aiFab:active{transform:scale(.92)}
.searchbar svg{width:17px;height:17px;flex:0 0 17px;color:var(--ink-3)}
.card .more svg{width:16px;height:16px}
.row .chev svg{width:16px;height:16px}

.chips{display:flex;gap:10px;align-items:center;padding:14px 20px 2px}
.chipsScroll{display:flex;gap:8px;align-items:center;overflow-x:auto;flex:1 1 auto;min-width:0}
.chipsScroll::-webkit-scrollbar{display:none}
.chipsEnd{flex:0 0 auto;color:var(--ink-2);padding:0 2px}
.chip{
  flex:0 0 auto;border:0;background:var(--chip);color:var(--ink-2);font:inherit;font-size:12.5px;font-weight:600;
  padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center;
}
.chip b{font-weight:800;color:var(--ink-3)}
.chip.on{background:var(--accent);color:#fff}
.chip.on b{color:rgba(255,255,255,.72)}
.chips .spacer{margin-left:auto}

/* ===== 课程卡片 ===== */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 20px 0}
.card{
  border:1px solid var(--line);border-radius:var(--radius);padding:15px 14px 13px;background:#fff;
  cursor:pointer;transition:transform .14s ease, box-shadow .14s ease;position:relative;
}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card .glyph{height:40px;display:flex;align-items:center;color:var(--ink)}
.card .glyph svg{height:36px;width:auto;max-width:64px}
.card .glyph .aa{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1}
.card .more{position:absolute;right:10px;top:12px;color:var(--ink-4)}
.card .name{font-size:15.5px;font-weight:800;letter-spacing:-.3px;margin-top:12px}
.card .desc{font-size:11.5px;color:var(--ink-3);margin-top:4px;min-height:15px}
.card .bar{height:4px;border-radius:3px;background:#eceef1;margin-top:12px;overflow:hidden}
.card .bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.card .cnt{font-size:11.5px;color:var(--ink-3);text-align:right;margin-top:6px;font-variant-numeric:tabular-nums}
.card.placeholder .glyph,.card.placeholder .name{color:var(--ink-3)}
.card .tag{position:absolute;left:14px;top:14px;font-size:10px;background:var(--chip);color:var(--ink-3);border-radius:6px;padding:2px 6px}

/* ===== 章节列表 ===== */
.grouplabel{font-size:11.5px;color:var(--ink-4);letter-spacing:.02em;padding:18px 22px 6px}
.list{padding:0 12px}
.row{
  display:flex;align-items:center;gap:14px;padding:12px 10px;border-radius:16px;cursor:pointer;position:relative;
}
.row:hover{background:var(--bg-soft)}
.row.on{background:#f5f6f8}
.row .thumb{
  width:46px;height:46px;flex:0 0 46px;border-radius:13px;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);
}
.row .thumb svg{width:24px;height:24px}
.row .thumb.num{font-size:17px;font-weight:800}
.row .meta{min-width:0;flex:1 1 auto}
.row .t{font-size:15px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:11.5px;color:var(--ink-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .n{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.row .chev{color:var(--ink-4);display:grid;place-items:center}
.row .done{color:var(--ink)}
.row.pending .t,.row.pending .s{color:var(--ink-3)}

.fab{
  position:absolute;right:22px;bottom:104px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;box-shadow:0 12px 24px rgba(16,18,20,.28);z-index:30;border:0;cursor:pointer;
}

/* ===== 底部导航 ===== */
.tabbar{
  position:absolute;left:12px;right:12px;bottom:12px;height:70px;background:rgba(255,255,255,.92);
  backdrop-filter:blur(18px);border:1px solid rgba(0,0,0,.05);box-shadow:0 -6px 26px rgba(16,18,20,.09);
  border-radius:28px;display:flex;align-items:center;justify-content:space-around;padding:0 10px 6px;z-index:40;
}
.tabbar button{
  border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink-4);
  font:inherit;font-size:11px;font-weight:600;cursor:pointer;padding:8px 12px;border-radius:14px;
}
.tabbar button.on{color:var(--ink)}
.tabbar button.on .dot{width:4px;height:4px;border-radius:50%;background:var(--ink);display:block}
.tabbar button .dot{height:4px;display:block}

/* ===== 阅读器 ===== */
.reader{display:flex;flex-direction:column;height:100%}
.rhead,.rtabs,.pageNo,.progressTop{flex:0 0 auto}   /* 顶部这些固定高度，不被正文挤扁 */
.rbody{flex:1 1 0;min-height:0}                     /* 关键：允许正文区域缩放，自己滚 */
.rhead{display:flex;align-items:center;gap:10px;padding:2px 14px 0;position:relative}
.rhead .center{flex:1 1 auto;text-align:center;min-width:0}
.rhead .center .t{font-size:14.5px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rhead .center .s{font-size:11px;color:var(--ink-3);margin-top:2px}
.rhead .side{display:flex;gap:12px;align-items:center;color:var(--ink);width:60px}
.rhead .side.right{justify-content:flex-end}
.rtabs{display:flex;gap:22px;padding:12px 20px 0;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:8px}
.rtabs::-webkit-scrollbar{display:none}
.rtabs button{
  border:0;background:none;font:inherit;font-size:13.5px;font-weight:600;color:var(--ink-4);padding:0 0 11px;
  position:relative;white-space:nowrap;cursor:pointer;
}
.rtabs button.on{color:var(--ink)}
.rtabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2.5px;background:var(--ink);border-radius:2px}
.pageNo{display:flex;justify-content:flex-end;padding:10px 22px 0;font-size:12px;color:var(--ink-4);font-variant-numeric:tabular-nums}
.progressTop{height:2px;background:transparent;flex:0 0 2px}
.progressTop i{display:block;height:100%;background:var(--ink);width:0;transition:width .1s linear}
.rbody{flex:1 1 auto;overflow-y:auto;padding:2px 22px 96px;font-size:15px;line-height:1.78;color:var(--ink-2);scroll-behavior:smooth}
.rbody::-webkit-scrollbar{width:0}
.rfoot{
  position:absolute;left:0;right:0;bottom:0;height:78px;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);
  border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;padding-bottom:10px;z-index:35;
}
.rfoot button{
  border:0;background:none;font:inherit;font-size:10.5px;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;
  gap:6px;cursor:pointer;padding:6px 14px;border-radius:12px;
}
.rfoot button.on{color:var(--ink);font-weight:600}

/* 正文排版 */
.doc h1{font-size:25px;font-weight:800;letter-spacing:-.7px;margin:6px 0 14px;line-height:1.28;color:var(--ink);scroll-margin-top:12px}
.doc h2{font-size:19px;font-weight:800;letter-spacing:-.4px;margin:26px 0 10px;color:var(--ink);scroll-margin-top:12px}
.doc h3{font-size:16px;font-weight:700;margin:22px 0 8px;color:var(--ink)}
.doc h4{font-size:14.5px;font-weight:700;margin:18px 0 6px;color:var(--ink)}
.doc p{margin:0 0 12px}
.doc strong{color:var(--ink);font-weight:700}
.doc ul,.doc ol{margin:0 0 14px;padding-left:22px}
.doc li{margin:0 0 7px}
.doc ul li::marker{color:var(--ink)}
.doc ol li::marker{color:var(--ink);font-weight:700}
.doc li>ul,.doc li>ol{margin-top:7px}
.doc hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.doc a{color:#0b62d0;text-decoration:none}
.doc blockquote{
  margin:0 0 14px;padding:11px 14px;background:var(--bg-soft);border-left:3px solid #cfd3d9;border-radius:0 10px 10px 0;
  color:var(--ink-2);font-size:14px;
}
.doc blockquote p:last-child{margin-bottom:0}
.doc code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Cascadia Mono",monospace;font-size:12.8px;
  background:#f2f3f5;color:#24272c;padding:2px 5px;border-radius:5px;word-break:break-word;
}
.doc pre{
  margin:0 0 16px;background:#f7f8fa;border:1px solid var(--line);border-radius:14px;padding:13px 14px;overflow-x:auto;
}
.doc pre code{background:none;padding:0;font-size:12.4px;line-height:1.68;white-space:pre}
.tableWrap{overflow-x:auto;margin:0 0 16px;border:1px solid var(--line-2);border-radius:14px}
.doc table{border-collapse:collapse;width:100%;font-size:12.8px}
.doc th,.doc td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top;line-height:1.6}
.doc th{background:#f7f8fa;font-weight:700;color:var(--ink);white-space:nowrap}
.doc tr:last-child td{border-bottom:0}
.doc th:last-child,.doc td:last-child{border-right:0}
.doc input[type=checkbox]{width:17px;height:17px;margin-right:8px;vertical-align:-3px;accent-color:#111}
.doc table input[type=checkbox]{margin:0}
.doc li:has(> input[type=checkbox]){list-style:none;margin-left:-20px;display:flex;gap:0;align-items:flex-start}

/* 答案折叠 */
.answerGate{
  display:flex;align-items:center;gap:10px;width:100%;border:1px dashed var(--line-2);background:var(--bg-soft);
  border-radius:14px;padding:14px;font:inherit;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer;margin:6px 0 16px;
}
.answerGate .k{font-size:11px;color:var(--ink-4);font-weight:500}
.hidden{display:none !important}

/* 底部弹层 */
.sheetMask{position:absolute;inset:0;background:rgba(16,18,20,.34);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.sheetMask.on{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;z-index:80;
  transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);max-height:78%;display:flex;flex-direction:column;
}
.sheet.on{transform:translateY(0)}
.sheet .grab{width:38px;height:4px;border-radius:3px;background:#d8dbe0;margin:10px auto 4px}
.sheet .st{font-size:14.5px;font-weight:800;padding:8px 20px 10px;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.sheet .sb{overflow-y:auto;padding:0 20px 22px}
.sheet .item{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer}
.sheet .item:last-child{border-bottom:0}
.sheet .item .idx{color:var(--ink-4);font-size:11.5px;width:16px;flex:0 0 16px;font-variant-numeric:tabular-nums}
.sheet .item.on{color:var(--ink);font-weight:700}
.sheet .item .tail{margin-left:auto;font-size:11px;color:var(--ink-4)}
.sheet textarea{
  width:100%;min-height:88px;border:1px solid var(--line-2);border-radius:14px;padding:12px;font:inherit;font-size:13.5px;
  resize:vertical;background:var(--bg-soft);line-height:1.6;
}
.sheet .btn{
  margin-top:12px;width:100%;border:0;background:var(--accent);color:#fff;font:inherit;font-size:14px;font-weight:700;
  padding:13px;border-radius:14px;cursor:pointer;
}
.sheet .btn.ghost{background:var(--chip);color:var(--ink);font-weight:600;margin-top:8px}
.noteCard{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;font-size:13.5px;line-height:1.65}
.noteCard .t{font-size:11px;color:var(--ink-4);margin-bottom:6px;display:flex;justify-content:space-between}
.empty{text-align:center;color:var(--ink-4);font-size:12.5px;padding:26px 10px;line-height:1.8}

/* ===== 今日任务 ===== */
.datestrip{display:flex;gap:6px;padding:16px 14px 6px;overflow-x:auto}
.datestrip::-webkit-scrollbar{display:none}
.datestrip button{
  flex:0 0 auto;border:0;background:none;font:inherit;border-radius:16px;padding:10px 12px;min-width:52px;cursor:pointer;
  color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:5px;
}
.datestrip button.on{background:var(--accent);color:#fff}
.datestrip .m{font-size:11px;font-weight:700}
.datestrip .d{font-size:17px;font-weight:800;letter-spacing:-.4px}
.datestrip .w{font-size:10.5px;letter-spacing:.04em}
.datestrip .pip{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.55}
.datestrip button:not(.on) .pip{visibility:hidden}
.todayHead{padding:14px 22px 2px;display:flex;align-items:flex-start;gap:12px}
.todayHead .big{font-size:23px;font-weight:800;letter-spacing:-.6px}
.todayHead .big small{font-size:15px;font-weight:700;margin-left:8px}
.todayHead .meta{font-size:11.5px;color:var(--ink-3);margin-top:6px}
.ring{margin-left:auto;width:56px;height:56px;position:relative;flex:0 0 56px}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:800}
.tasks{padding:14px 14px 0;display:flex;flex-direction:column;gap:8px}
.task{
  display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:18px;background:#fff;border:1px solid var(--line);
  cursor:pointer;
}
.task .ic{width:38px;height:38px;flex:0 0 38px;border-radius:11px;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.task .ic svg{width:20px;height:20px}
.task .ic .aa{font-size:17px;font-weight:800}
.task .body{flex:1 1 auto;min-width:0}
.task .body .t{font-size:13.5px;font-weight:600;letter-spacing:-.1px}
.task .body .m{font-size:11px;color:var(--ink-3);margin-top:5px;display:flex;align-items:center;gap:5px}
.task .body .m svg{width:13px;height:13px;flex:0 0 13px}
.task .check{width:22px;height:22px;flex:0 0 22px;border-radius:50%;border:1.6px solid #d3d7dd;display:grid;place-items:center;color:#fff}
.task.done .check{background:var(--accent);border-color:var(--accent)}
.task.done .body .t{text-decoration:line-through;color:var(--ink-3)}
/* ===== 助教 · 今日建议（B 级） ===== */
/* ===== 回顾页：复习提醒 + 导出 ===== */
/* ===== 首页：最近阅读 ===== */
.setRow{display:flex;align-items:baseline;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.setRow span{color:var(--ink-3);flex:0 0 56px}
.setRow b{font-weight:600;color:var(--ink);min-width:0;word-break:break-all}
.recentWrap{padding:16px 20px 0}
.recentHd{font-size:12.5px;font-weight:800;letter-spacing:-.2px;color:var(--ink);display:flex;align-items:center;gap:8px}
.recentHd span{font-size:10.5px;font-weight:600;color:var(--ink-4)}
.recentEmpty{font-size:11.5px;color:var(--ink-4);line-height:1.6;margin-top:7px}
.recentRow{display:flex;gap:10px;overflow-x:auto;padding:11px 0 2px;margin:0 -20px;padding-left:20px;padding-right:20px}
.recentRow::-webkit-scrollbar{display:none}
.recentCard{flex:0 0 auto;width:196px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer}
.recentCard:active{transform:scale(.98)}
.recentCard .rcIco{display:grid;place-items:center;width:26px;height:26px;color:var(--ink);margin-bottom:9px}
.recentCard .rcIco svg{width:22px;height:22px}
.recentCard .rcIco .aa{font-size:18px;font-weight:800}
.recentCard b{display:block;font-size:13.5px;font-weight:700;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.dwRow .dwGlyph svg{width:19px;height:19px;color:var(--ink)}

.cModel{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:8px 11px;font:inherit;font-size:11.5px;
  font-weight:600;color:var(--ink-3);display:flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap;margin-left:auto}

.extRow b{display:block;font-size:13.5px;font-weight:700}
.extRow .eSub{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px;line-height:1.5}
.extRow .eTag{margin-left:auto;font-size:10px;color:var(--ink-4);background:var(--chip);border-radius:999px;padding:3px 8px;flex:0 0 auto}
/* 助教日报卡 */

.chatPage{display:flex;flex-direction:column;height:100%}
.chatBody{flex:1 1 0;min-height:0;overflow-y:auto;padding:6px 20px 96px}
.chatBody::-webkit-scrollbar{width:0}

.chatComposer .aiNote{margin-top:8px}
.cChips{display:flex;align-items:center;gap:8px;margin-bottom:9px;overflow-x:auto}
.cChips::-webkit-scrollbar{display:none}
.cChip{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:8px 12px;font:inherit;font-size:12px;font-weight:600;
  color:var(--ink-2);display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}

.cChip.on{border-color:#111214;color:var(--ink);background:#f7f8fa}

.cModel svg{width:11px;height:11px}
.chatEmpty{text-align:center;padding:34px 8px 10px;color:var(--ink-3)}
.chatEmpty .ceLogo{width:52px;height:52px;border-radius:50%;background:#eef2ff;color:#4d6bfe;display:inline-grid;place-items:center;margin-bottom:14px}
.chatEmpty .ceLogo svg{width:32px;height:32px}
.chatEmpty .ceTitle{font-size:15px;font-weight:700;color:var(--ink);line-height:1.5}
.chatEmpty .ceSub{font-size:12px;margin-top:8px;line-height:1.7}
.groupRow{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;color:var(--ink-2);padding:14px 0 4px}
.groupRow .tail{margin-left:auto;font-size:11px;color:var(--ink-4);font-weight:600}
.groupRow .gGlyph{display:grid;place-items:center;color:var(--ink-3)}
.groupRow .gGlyph svg{width:17px;height:17px}
.groupRow.brain{padding-top:2px}
.assistCard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;margin-top:8px;cursor:pointer}
.assistCard .aHead{display:flex;align-items:center;gap:11px}
.assistCard .aIcon{flex:0 0 30px;height:30px;display:grid;place-items:center;color:var(--ink)}
.assistCard .aIcon svg{width:24px;height:24px}
.assistCard .aTitle{font-size:14.5px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:7px}
.badgeB{font-style:normal;font-size:10.5px;font-weight:800;color:#0a7a55;background:#e4f6ee;border-radius:999px;padding:2px 7px;line-height:1.5}
.assistCard .chev{margin-left:auto;color:var(--ink-4);display:grid;place-items:center;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.assistCard .chev svg{width:16px;height:16px}
.aUl{margin:10px 0 0;padding-left:17px}
.aUl li{font-size:12.5px;line-height:1.72;color:var(--ink-2);margin-bottom:6px}
.aUl li:last-child{margin-bottom:0}
.aUl b{font-weight:700;color:var(--ink)}
.aSplit{font-size:11.5px;font-weight:700;color:var(--ink-3);margin:14px 0 8px}
.aFoot{font-size:10.5px;color:var(--ink-4);line-height:1.6;margin-top:12px;padding-top:9px;border-top:1px solid var(--line)}
.quote{
  margin:16px 14px 0;padding:14px 16px;border-radius:18px;background:var(--bg-soft);border:1px solid var(--line);
  display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2);
}
.quote .qbtn{margin-left:auto;border:0;background:#fff;border:1px solid var(--line-2);border-radius:999px;padding:8px 13px;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap}

/* 专注模式 */
.focus{
  position:absolute;inset:0;background:#0e0f11;color:#fff;z-index:90;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:18px;opacity:0;pointer-events:none;transition:opacity .25s;
}
.focus.on{opacity:1;pointer-events:auto}
.focus .ft{font-size:12.5px;letter-spacing:.16em;color:rgba(255,255,255,.6)}
.focus .clock{font-size:76px;font-weight:800;letter-spacing:-3px;font-variant-numeric:tabular-nums}
.focus .fsub{font-size:13px;color:rgba(255,255,255,.65)}
.focus .fbtns{display:flex;gap:12px;margin-top:6px}
.focus .fbtns button{border:1px solid rgba(255,255,255,.28);background:none;color:#fff;font:inherit;font-size:13px;font-weight:600;padding:11px 22px;border-radius:999px;cursor:pointer}
.focus .fbtns button.solid{background:#fff;color:#111;border-color:#fff}

/* ===== 搜索 ===== */
.searchbar{display:flex;align-items:center;gap:10px;margin:6px 20px 0;background:var(--chip);border-radius:14px;padding:11px 13px}
.searchbar input{border:0;background:none;font:inherit;font-size:14px;outline:none;flex:1 1 auto;color:var(--ink)}
.hit{padding:14px 20px;border-bottom:1px solid var(--line);cursor:pointer}
.hit .src{font-size:11px;color:var(--ink-4);margin-bottom:5px}
.hit .ttl{font-size:14px;font-weight:700;margin-bottom:5px}
.hit .snip{font-size:12.5px;color:var(--ink-3);line-height:1.65}
.hit mark{background:#fff3b0;color:inherit;padding:0 2px;border-radius:3px}

/* 回顾 */
.stat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:14px 20px 0}
.stat .box{border:1px solid var(--line);border-radius:16px;padding:13px 12px}
.stat .box .n{font-size:22px;font-weight:800;letter-spacing:-.6px}
.stat .box .l{font-size:11px;color:var(--ink-3);margin-top:4px}
.sect{padding:22px 20px 0}
.sect .h{font-size:13px;font-weight:800;letter-spacing:-.1px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sect .h .cnt{font-size:11px;color:var(--ink-4);font-weight:600}
.miss{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:9px;font-size:13px;line-height:1.6;display:flex;gap:10px}
.miss .x{margin-left:auto;color:var(--ink-4);cursor:pointer;font-size:15px;line-height:1}
.missWrap{display:flex;gap:8px;margin-bottom:12px}
.missWrap input{flex:1 1 auto;border:1px solid var(--line-2);border-radius:12px;padding:11px 12px;font:inherit;font-size:13px;background:var(--bg-soft);outline:none}
.missWrap button{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:0 16px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}

/* 手机适配：真机上直接满屏 */
@media (max-width:900px){
  /* 手机：整页不许滚，只有内容区滚 —— 否则底部导航栏会跟着滑到最下面 */
  html,body{height:100%;overflow:hidden;background:#fff}
  .board{display:none}
  .stage{display:block;height:100%;min-height:0}
  .phoneWrap{padding:0;height:100%;display:block}
  .phone{width:100%;height:100%;max-height:none;border-radius:0;padding:0;box-shadow:none}
  .screen{border-radius:0}
  .notch{display:none}
  .view{overflow-y:auto;overscroll-behavior:contain}
}

.stages .stage.done .dot{background:#c6cbd2;border-color:#c6cbd2}
.stages .line1{display:flex;align-items:baseline;gap:7px;font-size:13px}
.stages .line1 b{font-weight:700}
.stages .now{font-style:normal;font-size:10.5px;color:var(--ink-3);background:#e6e9ed;border-radius:999px;padding:1px 7px}
.stages .when{margin-left:auto;font-size:11px;color:var(--ink-4);font-variant-numeric:tabular-nums;white-space:nowrap}
.stages .sub{font-size:11.5px;color:var(--ink-3);margin-top:4px;line-height:1.55}
.ovAdvice{display:flex;align-items:center;gap:9px;background:#eceef1;border-radius:14px;padding:11px 12px;margin-top:8px;font-size:12px;line-height:1.6;color:var(--ink-2)}
.ovAdvice .ic{flex:0 0 18px;color:var(--ink-3);display:grid;place-items:center}
.ovAdvice .ic svg{width:18px;height:18px}
.ovAdvice b{font-weight:700;color:var(--ink)}
.ovAdvice .chev{margin-left:auto;color:var(--ink-4);display:grid;place-items:center}
.ovAdvice .chev svg{width:14px;height:14px}
/* 建议展开后的一整份（点建议条展开，不跳走） */
.ovAdvice .chev{transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.advList{margin-top:6px;display:flex;flex-direction:column;gap:7px}
.advItem{display:flex;gap:9px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 11px;font-size:12.3px;line-height:1.65;color:var(--ink-2)}
.advItem .tag{flex:0 0 auto;font-size:10.5px;font-weight:800;color:var(--ink-3);background:#f2f4f7;border-radius:6px;padding:2px 6px;margin-top:1px}
.advGo{margin-top:2px;border:0;background:none;color:#4d6bfe;font:inherit;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:4px;padding:6px 2px;cursor:pointer}
.advGo svg{width:13px;height:13px}
@keyframes pop{0%{transform:scale(.55)}62%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes flashIn{0%{background:#eef1f4}100%{background:transparent}}
@keyframes riseIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 手指按下去立刻有反馈（比等页面动画快，才有"跟手"的感觉） */
.card,.row,.task,.chip,.hit,.noteCard,.tabbar button,.rfoot button,.iconbtn,.qbtn,.fab,.sheet .item,.sheet .btn{
  transition:transform .13s ease, background .2s ease, color .2s ease;
}
.card:active,.row:active,.task:active,.hit:active,.noteCard:active,.sheet .item:active{transform:scale(.975)}
.chip:active,.tabbar button:active,.rfoot button:active,.iconbtn:active,.qbtn:active,.sheet .btn:active{transform:scale(.93)}
.fab:active{transform:scale(.9)}

/* 任务勾选：打勾弹一下 + 整行闪一下 */
.task .check{transition:background .25s ease, border-color .25s ease, transform .13s ease}
.task.just-changed{animation:flashIn .6s ease-out}
.task.just-changed .check{animation:pop .4s cubic-bezier(.2,.8,.2,1)}
.task.done .check svg{animation:pop .32s cubic-bezier(.2,.8,.2,1)}

/* 进度条 / 进度环数字变化时滑过去，不硬跳 */
.card .bar i, .bar i{transition:width .6s cubic-bezier(.2,.8,.2,1)}
.ring circle:last-child{transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}

/* 底部导航：切到哪一项，图标弹一下 */
.tabbar button.on svg{animation:pop .34s cubic-bezier(.2,.8,.2,1)}
.tabbar button.on .dot{animation:pop .34s .05s cubic-bezier(.2,.8,.2,1)}

/* 卡片图标悬停抬一下 */
.card .glyph{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.card:hover .glyph{transform:translateY(-2px)}

/* 空状态、提示文字淡入 */
.empty{animation:riseIn .35s cubic-bezier(.2,.8,.2,1) both}

/* 系统设置里关了动效就全部停掉 */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-delay:0ms !important;transition-duration:.001ms !important}
}

/* =========================================================================
   AI 助手面板（照你那张 DeepSeek 截图做的）
   ========================================================================= */
.aiMask{position:absolute;inset:0;background:rgba(16,18,20,.28);z-index:86;opacity:0;pointer-events:none;transition:opacity .24s}
.aiMask.on{opacity:1;pointer-events:auto}
.aiPanel{
  position:absolute;left:8px;right:8px;bottom:8px;height:76%;background:#fff;border-radius:22px;z-index:88;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 -12px 40px rgba(16,18,20,.22), 0 2px 8px rgba(16,18,20,.1);
  transform:translateY(104%);transition:transform .3s cubic-bezier(.32,.72,0,1);
}
.aiPanel.on{transform:translateY(0)}
.aiPanel.full{height:calc(100% - 16px)}
.aiGrab{height:14px;flex:0 0 14px;display:grid;place-items:center;cursor:grab;touch-action:none}
.aiGrab i{width:38px;height:4px;border-radius:3px;background:#d8dbe0;display:block}
.aiHd{display:flex;align-items:center;gap:9px;padding:2px 14px 11px;flex:0 0 auto}
.aiLogo{width:26px;height:26px;border-radius:50%;background:#4d6bfe;color:#fff;display:grid;place-items:center;flex:0 0 26px}
.aiLogo svg{width:17px;height:17px}
.aiHd .aiName{font-size:14.5px;font-weight:700;letter-spacing:-.2px}
.aiHd .aiWhere{display:block;font-size:10.5px;color:var(--ink-4);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.aiHd .aiActs{margin-left:auto;display:flex;gap:8px}
.aiCircle{width:30px;height:30px;border-radius:50%;background:#f2f4f7;border:0;color:var(--ink-2);display:grid;place-items:center;cursor:pointer}
.aiCircle svg{width:16px;height:16px}
.aiCircle:active{transform:scale(.92)}
.aiBody{flex:1 1 0;min-height:0;overflow-y:auto;padding:4px 14px 8px;background:#fff}
.aiBody::-webkit-scrollbar{width:0}
.aiMsg{display:flex;gap:9px;margin-bottom:16px;animation:riseIn .3s cubic-bezier(.2,.8,.2,1) both}
.aiMsg.me{justify-content:flex-end}
.aiMsg .av{width:24px;height:24px;border-radius:50%;background:#4d6bfe;color:#fff;display:grid;place-items:center;flex:0 0 24px;margin-top:3px}
.aiMsg .av svg{width:15px;height:15px}
.aiMsg.me .txt{background:#e8efff;color:#16255c;border-radius:16px;padding:11px 14px;max-width:82%;font-size:14px;line-height:1.7}
.aiMsg.ai .txt{max-width:100%;font-size:14px;line-height:1.78;color:var(--ink-2)}
.aiMsg.ai .txt p{margin:0 0 10px}
.aiMsg.ai .txt p:last-child{margin-bottom:0}
.aiMsg.ai .txt code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:#f2f3f5;padding:2px 5px;border-radius:5px}
.aiMsg.ai .txt pre{background:#f7f8fa;border:1px solid var(--line);border-radius:12px;padding:11px 12px;overflow-x:auto;margin:0 0 10px}
.aiMsg.ai .txt pre code{background:none;padding:0;font-size:12.3px;line-height:1.66;white-space:pre}
.aiSrc{border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin:10px 0 0;font-size:12.5px;line-height:1.68;cursor:pointer;background:#fff}
.aiSrc:hover{border-color:var(--line-2)}
.aiSrc .top{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-4);margin-bottom:6px}
.aiSrc .go{margin-left:auto;color:#3b6ef6;font-weight:600}
.aiActs2{display:flex;gap:16px;color:var(--ink-4);margin:9px 0 0 33px;font-size:12.5px}
.aiActs2 button{border:0;background:none;color:inherit;cursor:pointer;display:flex;gap:5px;align-items:center;padding:0}
.aiActs2 button svg{width:15px;height:15px}
.aiActs2 button:active{transform:scale(.9)}
.aiChips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 0 33px}
.aiChips button{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:7px 11px;font:inherit;font-size:12px;color:var(--ink-2);cursor:pointer}
.aiChips button:active{transform:scale(.96)}
.aiComposer{flex:0 0 auto;border-top:1px solid var(--line);padding:10px 12px 14px;background:#fff}
.aiMeta{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.aiModel{border:1px solid var(--line-2);border-radius:999px;padding:7px 12px;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);background:#fff;display:flex;gap:6px;align-items:center;cursor:pointer}
.aiModel svg{width:13px;height:13px;color:var(--ink-4)}
.aiThink{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);cursor:pointer;border:0;background:none;font-family:inherit}
.switch{width:44px;height:26px;border-radius:999px;background:#dfe3e8;position:relative;transition:background .22s;display:block;flex:0 0 44px}
.switch i{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.22);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.switch.on{background:#3b6ef6}
.switch.on i{transform:translateX(18px)}
.aiInput{display:flex;align-items:flex-end;gap:8px}
.aiInput textarea{flex:1 1 auto;border:0;background:#f2f4f7;border-radius:16px;padding:12px 14px;font:inherit;font-size:14px;line-height:1.5;min-height:44px;max-height:96px;resize:none;outline:none;color:var(--ink)}
.aiPlus,.aiSend{width:40px;height:40px;flex:0 0 40px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer}
.aiPlus{background:#f2f4f7;color:var(--ink-2)}
.aiSend{background:#d6dae0;color:#fff;transition:background .2s}
.aiSend.on{background:#3b6ef6}
.aiPlus svg,.aiSend svg{width:19px;height:19px}
.aiTyping{display:flex;gap:5px;align-items:center;padding:6px 0}
.aiTyping i{width:6px;height:6px;border-radius:50%;background:#b9bfc7;display:block;animation:blink 1s infinite}
.aiTyping i:nth-child(2){animation-delay:.16s}
.aiTyping i:nth-child(3){animation-delay:.32s}
@keyframes blink{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
.aiNote{font-size:11.5px;color:var(--ink-4);line-height:1.7;margin-top:8px;display:flex;gap:6px}
.aiNote svg{width:13px;height:13px;flex:0 0 13px;margin-top:3px}

/* 连接状态条 */
.aiStatus{display:flex;align-items:center;gap:7px;font-size:11.5px;line-height:1.5;padding:8px 10px;border-radius:11px;margin-bottom:9px}
.aiStatus svg{width:13px;height:13px;flex:0 0 13px}
.aiStatus span{flex:1 1 auto;min-width:0}
.aiStatus button{border:0;background:#fff;border-radius:999px;padding:5px 10px;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.aiStatus.on{background:#eef4ff;color:#1b3f9c}
.aiStatus.on button{color:#1b3f9c}
.aiStatus.demo{background:#fff6e6;color:#8a5a00}
.aiStatus.demo button{color:#8a5a00}
.aiStatus.off{background:#f3f4f6;color:var(--ink-3)}
.aiStatus.off button{color:var(--ink-2)}

/* 总大脑给的排期卡 */
.aiPlan{border:1px solid #dfe6f5;background:#f7faff;border-radius:14px;padding:12px 13px;margin-top:12px}
.aiPlan .ph{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#1b3f9c;margin-bottom:8px}
.aiPlan .ph svg{width:14px;height:14px}
.aiPlan .pl{font-size:13.5px;font-weight:700;line-height:1.6;margin-bottom:8px;color:var(--ink)}
.aiPlan ul{margin:0 0 10px;padding-left:18px}
.aiPlan li{font-size:12.8px;line-height:1.7;color:var(--ink-2);margin-bottom:3px}
.planTask{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:6px;font-size:12.5px;line-height:1.5}
.planTask .pd{font-size:11px;font-weight:800;color:#1b3f9c;background:#eef4ff;border-radius:6px;padding:2px 6px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.planTask .pm{margin-left:auto;font-size:11px;color:var(--ink-4);white-space:nowrap}
.aiPlan .pw{font-size:11.5px;color:#8a5a00;background:#fff6e6;border-radius:10px;padding:8px 10px;margin-top:6px;line-height:1.6}
.aiPlan .btn{margin-top:10px}

<script>window.__DATA__ = {"docs":{"nc1guide":{"id":"nc1guide","title":"计算机一级 · 备考指南","sub":"美术生 7 天速通","sections":[{"id":"s0","title":"开篇","tab":"开篇","html":"<blockquote>\n<p>适用：2026 年 9 月 19—21 日 NCRE 第 78 次考试（科目代码 18）<br>今天是 9 月 12 日，距离考试约 7 天。目标：稳过 60 分，冲 70+。</p>\n</blockquote>\n<hr>\n","text":"适用：2026 年 9 月 19—21 日 NCRE 第 78 次考试（科目代码 18） 今天是 9 月 12 日，距离考试约 7 天。目标：稳过 60 分，冲 70+。","chars":85},{"id":"s1","title":"一、先吃颗定心丸：这门考试不考编程","tab":"一、先吃颗定心丸","html":"<p>你完全不需要会写代码、不需要会训练模型、不需要数学功底深。整张卷子考的是：</p>\n<p><strong>概念理解 + 场景判断 + 少量加减乘除（计算题只有最后 4 道填空题）</strong></p>\n<p>题型与分值（90 分钟，100 分，60 分合格）：</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>题型</th>\n<th>数量</th>\n<th>分值</th>\n<th>难度定位</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>单项选择题</td>\n<td>50 题</td>\n<td>50 分</td>\n<td>基础，主要送分</td>\n</tr>\n<tr>\n<td>多项选择题</td>\n<td>10 题</td>\n<td>30 分</td>\n<td>拉分项，需要知识点清晰</td>\n</tr>\n<tr>\n<td>综合填空题</td>\n<td>4 题</td>\n<td>20 分</td>\n<td>一半是算术填空，一半是概念填空</td>\n</tr>\n</tbody></table></div>\n<h3>美术生的优势分析</h3>\n<p>这门课六大模块里，「大模型应用」「提示工程」「生成式 AI」「安全伦理」加起来约占 30–40 分，<br>而这些正是你平时用 AI 画画、写提示词时天天接触的东西。你的真正弱项只有两块：</p>\n<ol>\n<li><strong>算力硬件</strong>（CPU/GPU/NPU 那堆缩写）→ 靠&quot;对应关系表&quot;死记，半天搞定；</li>\n<li><strong>算法名称</strong>（KNN、K-Means、决策树……）→ 靠&quot;对比表 + 类比&quot;理解，两天搞定。</li>\n</ol>\n<hr>\n","text":"你完全不需要会写代码、不需要会训练模型、不需要数学功底深。整张卷子考的是： 概念理解 + 场景判断 + 少量加减乘除（计算题只有最后 4 道填空题） 题型与分值（90 分钟，100 分，60 分合格）： 题型 数量 分值 难度定位 单项选择题 50 题 50 分 基础，主要送分 多项选择题 10 题 30 分 拉分项，需要知识点清晰 综合填空题 4 题 20 分 一半是算术填空，一半是概念填空 美术生的优势分析 这门课六大模块里，「大模型应用」「提示工程」「生成式 AI」「安全伦理」加起来约占 30–40 分， 而这些正是你平时用 AI 画画、写提示词时天天接触的东西。你的真正弱项只有两块： 算力硬件 （CPU/GPU/NPU 那堆缩写）→ 靠\"对应关系表\"死记，半天搞定； 算法名称 （KNN、K-Means、决策树……）→ 靠\"对比表 + 类比\"理解，两天搞定。","chars":387},{"id":"s2","title":"二、7 天冲刺日程表（每天 2–3 小时）","tab":"二、7 天冲刺日程表","html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>日期</th>\n<th>星期</th>\n<th>任务</th>\n<th>具体动作</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>9/12</td>\n<td>六</td>\n<td>摸底</td>\n<td>不计时做一遍官方样题（见资源包），对答案，把错的题标出属于哪个模块</td>\n</tr>\n<tr>\n<td>9/13</td>\n<td>日</td>\n<td>模块一 + 二</td>\n<td>概念篇 + 算力篇：背时间线，背 CPU/GPU/NPU 分工表</td>\n</tr>\n<tr>\n<td>9/14</td>\n<td>一</td>\n<td>模块三</td>\n<td>数据篇：结构化/非结构化、数据清洗、标注、知识图谱三元组</td>\n</tr>\n<tr>\n<td>9/15</td>\n<td>二</td>\n<td>模块四（上）</td>\n<td>监督/无监督/强化、回归、分类、聚类，背对比表</td>\n</tr>\n<tr>\n<td>9/16</td>\n<td>三</td>\n<td>模块四（下）+ 六</td>\n<td>神经网络三兄弟（CNN/RNN/Transformer）、生成式 AI、安全伦理</td>\n</tr>\n<tr>\n<td>9/17</td>\n<td>四</td>\n<td>模块五 + 计算题</td>\n<td>提示工程（ICIO）、LoRA、RAG；专项练 4 类计算填空</td>\n</tr>\n<tr>\n<td>9/18</td>\n<td>五</td>\n<td>全真模拟</td>\n<td>掐 90 分钟重做一遍样题 + 错题回顾 + 看速记卡</td>\n</tr>\n<tr>\n<td>9/19–21</td>\n<td>六日一</td>\n<td>考试</td>\n<td>带齐准考证 + 身份证，具体时段以准考证为准</td>\n</tr>\n</tbody></table></div>\n<blockquote>\n<p>每天先花 10 分钟回顾前一天内容，再学新内容；睡前刷 10 分钟考试宝题库。</p>\n</blockquote>\n<hr>\n","text":"日期 星期 任务 具体动作 9/12 六 摸底 不计时做一遍官方样题（见资源包），对答案，把错的题标出属于哪个模块 9/13 日 模块一 + 二 概念篇 + 算力篇：背时间线，背 CPU/GPU/NPU 分工表 9/14 一 模块三 数据篇：结构化/非结构化、数据清洗、标注、知识图谱三元组 9/15 二 模块四（上） 监督/无监督/强化、回归、分类、聚类，背对比表 9/16 三 模块四（下）+ 六 神经网络三兄弟（CNN/RNN/Transformer）、生成式 AI、安全伦理 9/17 四 模块五 + 计算题 提示工程（ICIO）、LoRA、RAG；专项练 4 类计算填空 9/18 五 全真模拟 掐 90 分钟重做一遍样题 + 错题回顾 + 看速记卡 9/19–21 六日一 考试 带齐准考证 + 身份证，具体时段以准考证为准 每天先花 10 分钟回顾前一天内容，再学新内容；睡前刷 10 分钟考试宝题库。","chars":408},{"id":"s3","title":"三、六大模块精讲（配美术生类比）","tab":"三、六大模块精讲","html":"<h3>模块一 · 基本概念（送分题库）</h3>\n<p><strong>必背时间线：</strong></p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>年份</th>\n<th>事件</th>\n<th>一句话记忆</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1950</td>\n<td>图灵提出图灵测试</td>\n<td>机器会&quot;装人&quot;才算智能</td>\n</tr>\n<tr>\n<td>1956</td>\n<td>达特茅斯会议，麦卡锡提出&quot;人工智能&quot;</td>\n<td>生日！AI 诞生</td>\n</tr>\n<tr>\n<td>1997</td>\n<td>深蓝战胜国际象棋冠军</td>\n<td>先赢棋</td>\n</tr>\n<tr>\n<td>2012</td>\n<td>AlexNet 夺得 ImageNet 冠军</td>\n<td>&quot;深度学习革命&quot;起点</td>\n</tr>\n<tr>\n<td>2016</td>\n<td>AlphaGo 战胜李世石</td>\n<td>再赢围棋</td>\n</tr>\n<tr>\n<td>2017</td>\n<td>Transformer 架构提出</td>\n<td>大模型的地基</td>\n</tr>\n<tr>\n<td>2020</td>\n<td>GPT-3 发布</td>\n<td>大模型规模开始起飞</td>\n</tr>\n<tr>\n<td>2022</td>\n<td>ChatGPT 发布</td>\n<td>出圈元年</td>\n</tr>\n<tr>\n<td>2025</td>\n<td>DeepSeek-R1</td>\n<td>卖点是推理成本大幅降低</td>\n</tr>\n</tbody></table></div>\n<p><strong>必背概念：</strong></p>\n<ul>\n<li>弱人工智能 = 只会干特定领域的事（现在所有 AI 都是弱 AI）；强人工智能 = 有自主意识和决策能力（还没实现）。<ul>\n<li>考试问&quot;通用人工智能&quot;时，关键词是<strong>跨领域应用能力</strong>。</li>\n</ul>\n</li>\n<li>三大学派记住名字即可：符号主义、联结主义、行为主义。现在的深度学习属于<strong>联结主义</strong>占主导。</li>\n<li>大语言模型四大特征：<strong>参数规模大、依赖海量训练数据、基于 Transformer 深度架构、多任务泛化能力强</strong>。<ul>\n<li>反着考：「不需要大量训练数据」是错的——这是高频陷阱。</li>\n</ul>\n</li>\n<li>大模型的局限：幻觉（一本正经胡说）、偏见、知识截止日期、算力成本高。</li>\n<li>大模型核心应用方法：预训练（海量无标签数据学语言规律）→ 微调 → 提示工程。</li>\n</ul>\n<h3>模块二 · 算力（美术生唯一&quot;硬背&quot;模块）</h3>\n<p><strong>三兄弟分工表（必背）：</strong></p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>处理器</th>\n<th>特长</th>\n<th>典型任务</th>\n<th>记忆钩子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>CPU</td>\n<td>通用计算、指令解析、控制逻辑</td>\n<td>系统控制、数据管理</td>\n<td>&quot;总导演&quot;</td>\n</tr>\n<tr>\n<td>GPU</td>\n<td>大规模并行计算</td>\n<td>3D 渲染、深度学习训练</td>\n<td>图形起家，画师老熟人</td>\n</tr>\n<tr>\n<td>NPU</td>\n<td>神经网络专用加速</td>\n<td>AI 推理（矩阵运算）</td>\n<td>&quot;专画一种画风的高手&quot;</td>\n</tr>\n<tr>\n<td>TPU</td>\n<td>张量处理专用芯片</td>\n<td>深度学习加速</td>\n<td>谷歌家自研</td>\n</tr>\n</tbody></table></div>\n<p><strong>高频陷阱：</strong></p>\n<ul>\n<li>「NPU 适用于所有计算任务」→ 错。它是专用加速器，不是万金油。</li>\n<li>算力构成要素：<strong>处理器性能、数据传输能力、并行计算能力</strong>。「数据加密能力」不属于算力。</li>\n<li>云计算 vs 边缘计算：<ul>\n<li>云计算 = 集中处理、弹性扩容、大任务（像回画室用大画架慢慢画大画）；</li>\n<li>边缘计算 = 就近处理、<strong>低时延、低功耗</strong>（像现场速写，立刻出结果）。</li>\n<li>题目出现&quot;低时延/低功耗/摄像头端实时处理&quot;→ 选边缘计算。</li>\n</ul>\n</li>\n<li>计算量算法（填空必考）：<strong>帧数 × 每帧点数 × 每点运算次数</strong>，注意单位（万/亿）和科学计数法。</li>\n</ul>\n<h3>模块三 · 数据</h3>\n<p><strong>数据分类（必背对比）：</strong></p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>类型</th>\n<th>例子</th>\n<th>记忆钩子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>结构化</td>\n<td>表格、数据库、Excel</td>\n<td>整整齐齐摆格子</td>\n</tr>\n<tr>\n<td>半结构化</td>\n<td>XML、JSON</td>\n<td>有标签/键值，但格式灵活</td>\n</tr>\n<tr>\n<td>非结构化</td>\n<td>文本、图像、音频、视频</td>\n<td>画室里的素材大杂烩</td>\n</tr>\n</tbody></table></div>\n<ul>\n<li>XML 特点：<strong>基于标签</strong>、支持注释、标签可自定义。（&quot;基于键值对&quot;是 JSON 的描述）</li>\n<li>数据预处理：<strong>数据清洗</strong> = 去噪声、补缺失值、修正错误数据；此外还有集成、变换、规约。</li>\n<li><strong>数据标注</strong> = 为监督学习提供带标签的训练数据。标注质量直接决定模型上限（人工标注成本高）。</li>\n<li><strong>知识表示</strong>的最核心目标：把知识转化为<strong>机器可处理的形式</strong>。</li>\n<li><strong>知识图谱 vs 知识库</strong>：知识库侧重存储；知识图谱强调<strong>图结构表示和语义关联</strong>，优势是<strong>可解释性</strong>（逻辑可溯、结构透明、可视化）。</li>\n<li><strong>三元组</strong>（填空高频）：<ul>\n<li>实体 — 关系 — 实体（北京 — 是首都 — 中国）</li>\n<li>实体 — 属性 — 属性值（北京市 — 人口 — 约 2000 万）</li>\n<li>提示：模式层写&quot;概念/类别&quot;，数据层写&quot;具体实例&quot;，填空时先判断题干给的是哪一层。</li>\n</ul>\n</li>\n<li>知识图谱构建常见步骤：数据清洗 → 实体识别 → 关系抽取（再配合知识融合、质量评估等）。</li>\n</ul>\n<h3>模块四 · 算法（理解 + 对比表，不要死背）</h3>\n<p><strong>学习方式三分法（务必区分）：</strong></p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>类型</th>\n<th>有无标签</th>\n<th>典型任务</th>\n<th>代表算法</th>\n<th>美术类比</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>监督学习</td>\n<td>有标签</td>\n<td>分类、回归</td>\n<td>决策树、KNN、线性回归、逻辑回归</td>\n<td>照着范画临摹</td>\n</tr>\n<tr>\n<td>无监督学习</td>\n<td>无标签</td>\n<td>聚类</td>\n<td>K-Means</td>\n<td>自己把画作按风格分堆</td>\n</tr>\n<tr>\n<td>强化学习</td>\n<td>靠奖励反馈</td>\n<td>决策控制</td>\n<td>Q-Learning、AlphaGo</td>\n<td>老师点评，试错改进</td>\n</tr>\n</tbody></table></div>\n<p><strong>数据划分</strong>：训练集（练手）、验证集（调参）、测试集（最终考核）。</p>\n<p><strong>五件套辨析（选择题最爱考）：</strong></p>\n<ol>\n<li><strong>线性回归</strong>：预测连续数值（如房价、销量）。用最小二乘法或梯度下降求参数，评价用 MSE。</li>\n<li><strong>逻辑回归</strong>：名字带回归，实际干<strong>分类</strong>，输出概率，用极大似然估计。</li>\n<li><strong>KNN</strong>：K 表示<strong>预测时参考的最近邻居数量</strong>（不是类别数！）。分类回归都能干。</li>\n<li><strong>K-Means</strong>：聚类算法。步骤 = 初始化 K 个质心 → 把点分给最近质心 → 更新质心为簇内均值 → 迭代。&quot;选离质心最近的 K 个样本&quot;描述的是 KNN，不是 K-Means，注意偷换概念。</li>\n<li><strong>决策树</strong>：可解释性强、决策过程直观。场景题里&quot;根据多个条件判断是否放贷/分类&quot;→ 决策树。</li>\n</ol>\n<p><strong>神经网络三兄弟：</strong></p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>网络</th>\n<th>擅长</th>\n<th>记忆钩子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>CNN 卷积神经网络</td>\n<td>图像分类、视觉任务</td>\n<td>C 画师，看局部笔触拼整体</td>\n</tr>\n<tr>\n<td>RNN 循环神经网络</td>\n<td>序列数据：文本、语音、时间序列</td>\n<td>一帧接一帧地看动画</td>\n</tr>\n<tr>\n<td>Transformer</td>\n<td>注意力机制，大模型底座</td>\n<td>一眼看全画面，理清元素关系</td>\n</tr>\n</tbody></table></div>\n<p><strong>训练效果判断：</strong></p>\n<ul>\n<li>训练集表现差、测试集也差 → <strong>欠拟合</strong>（功底不够）；</li>\n<li>训练集极好、测试集明显变差 → <strong>过拟合</strong>（只背会了这一张临摹，换角度就崩）。</li>\n<li>缓解过拟合：增加数据、正则化、Dropout、早停等。</li>\n</ul>\n<p><strong>生成式 AI：</strong></p>\n<ul>\n<li>核心特征：<strong>从数据中创造新内容</strong>（生成图、文、音、视频，而不是只做分类判断）。</li>\n<li>代表技术：GAN、扩散模型、大语言模型。</li>\n<li>判断场景题：&quot;动态生成个性化练习题&quot;属于生成式 AI；&quot;统计高频问题出报告&quot;不是。</li>\n</ul>\n<h3>模块五 · 大模型应用（你的主场，重点拿分）</h3>\n<p><strong>提示工程：</strong></p>\n<ul>\n<li>目的：<strong>通过设计输入指令，引导模型生成符合期望的输出</strong>（不改模型参数！）。</li>\n<li>常用技巧：角色设定、思维链（CoT：把复杂任务分解成步骤）、少样本示例、多模态输入。</li>\n<li><strong>ICIO 框架</strong>（填空高频，背熟四个字母）：<ul>\n<li><strong>I</strong>nstruction 指令：要模型做什么（如&quot;制定北京三日游计划&quot;）</li>\n<li><strong>C</strong>ontext 背景：给谁用、预算、约束条件</li>\n<li><strong>I</strong>nput Data 输入数据：素材、已知信息（如出发地、偏好、已订门票）</li>\n<li><strong>O</strong>utput Indicator 输出要求：格式、数量、字数、必须包含的要素</li>\n<li>美术类比：ICIO 就是一份标准<strong>约稿需求单</strong>——画什么 / 给谁画 / 参考素材 / 交付规格。</li>\n</ul>\n</li>\n</ul>\n<p><strong>大模型增强手段对比：</strong></p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>技术</th>\n<th>干什么</th>\n<th>关键词</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>提示工程</td>\n<td>改输入，不动模型</td>\n<td>零成本、最快</td>\n</tr>\n<tr>\n<td>RAG 检索增强</td>\n<td>外接知识库再回答</td>\n<td>知识更新、减少幻觉</td>\n</tr>\n<tr>\n<td>全参数微调</td>\n<td>重训整个模型</td>\n<td>效果好、贵</td>\n</tr>\n<tr>\n<td>LoRA</td>\n<td>只训练少量附加参数</td>\n<td>低成本、省算力、适合资源受限</td>\n</tr>\n</tbody></table></div>\n<ul>\n<li>智能代理（Agent）：能追问细节、调用工具、外接知识库 → 场景题里&quot;要求主动追问&quot;的客服系统选它。</li>\n<li>场景判断题：<ul>\n<li>金融领域<strong>不适合</strong>大语言模型的是：实时高频交易（要求毫秒级确定性，LLM 不是干这个的）；</li>\n<li>医疗要提升专业准确性 → 引入<strong>专家标注的</strong>专业数据集；</li>\n<li>降低算力需求但保性能 → 模型轻量化。</li>\n</ul>\n</li>\n</ul>\n<h3>模块六 · 安全与伦理（送分 + 价值观题）</h3>\n<ul>\n<li>隐私保护三原则：<strong>数据最小化</strong>（只收集必要数据）、授权同意、加密存储。</li>\n<li>高频场景判断：<ul>\n<li>误采集用户未授权录音 → 立即删除数据并关闭非必要采集；</li>\n<li>病历敏感信息 → 加密 + 访问认证；</li>\n<li>过度采集（人脸、身份证、家庭成员信息）→ 违背最小化原则。</li>\n</ul>\n</li>\n<li>算法偏见：缓解手段是<strong>增加公平性评估/统计检验</strong>，而不是&quot;加大模型&quot;或&quot;减少训练&quot;。</li>\n<li>AI 伦理：AI 是<strong>辅助</strong>决策，不是替代人承担责任。</li>\n<li>发展趋势：多模态、轻量化、端侧部署、推理成本持续下降。</li>\n</ul>\n<hr>\n","text":"模块一 · 基本概念（送分题库） 必背时间线： 年份 事件 一句话记忆 1950 图灵提出图灵测试 机器会\"装人\"才算智能 1956 达特茅斯会议，麦卡锡提出\"人工智能\" 生日！AI 诞生 1997 深蓝战胜国际象棋冠军 先赢棋 2012 AlexNet 夺得 ImageNet 冠军 \"深度学习革命\"起点 2016 AlphaGo 战胜李世石 再赢围棋 2017 Transformer 架构提出 大模型的地基 2020 GPT-3 发布 大模型规模开始起飞 2022 ChatGPT 发布 出圈元年 2025 DeepSeek-R1 卖点是推理成本大幅降低 必背概念： 弱人工智能 = 只会干特定领域的事（现在所有 AI 都是弱 AI）；强人工智能 = 有自主意识和决策能力（还没实现）。 考试问\"通用人工智能\"时，关键词是 跨领域应用能力 。 三大学派记住名字即可：符号主义、联结主义、行为主义。现在的深度学习属于 联结主义 占主导。 大语言模型四大特征： 参数规模大、依赖海量训练数据、基于 Transformer 深度架构、多任务泛化能力强 。 反着考：「不需要大量训练数据」是错的——这是高频陷阱。 大模型的局限：幻觉（一本正经胡说）、偏见、知识截止日期、算力成本高。 大模型核心应用方法：预训练（海量无标签数据学语言规律）→ 微调 → 提示工程。 模块二 · 算力（美术生唯一\"硬背\"模块） 三兄弟分工表（必背）： 处理器 特长 典型任务 记忆钩子 CPU 通用计算、指令解析、控制逻辑 系统控制、数据管理 \"总导演\" GPU 大规模并行计算 3D 渲染、深度学习训练 图形起家，画师老熟人 NPU 神经网络专用加速 AI 推理（矩阵运算） \"专画一种画风的高手\" TPU 张量处理专用芯片 深度学习加速 谷歌家自研 高频陷阱： 「NPU 适用于所有计算任务」→ 错。它是专用加速器，不是万金油。 算力构成要素： 处理器性能、数据传输能力、并行计算能力 。「数据加密能力」不属于算力。 云计算 vs 边缘计算： 云计算 = 集中处理、弹性扩容、大任务（像回画室用大画架慢慢画大画）； 边缘计算 = 就近处理、 低时延、低功耗 （像现场速写，立刻出结果）。 题目出现\"低时延/低功耗/摄像头端实时处理\"→ 选边缘计算。 计算量算法（填空必考）： 帧数 × 每帧点数 × 每点运算次数 ，注意单位（万/亿）和科学计数法。 模块三 · 数据 数据分类（必背对比）： 类型 例子 记忆钩子 结构化 表格、数据库、Excel 整整齐齐摆格子 半结构化 XML、JSON 有标签/键值，但格式灵活 非结构化 文本、图像、音频、视频 画室里的素材大杂烩 XML 特点： 基于标签 、支持注释、标签可自定义。（\"基于键值对\"是 JSON 的描述） 数据预处理： 数据清洗 = 去噪声、补缺失值、修正错误数据；此外还有集成、变换、规约。 数据标注 = 为监督学习提供带标签的训练数据。标注质量直接决定模型上限（人工标注成本高）。 知识表示 的最核心目标：把知识转化为 机器可处理的形式 。 知识图谱 vs 知识库 ：知识库侧重存储；知识图谱强调 图结构表示和语义关联 ，优势是 可解释性 （逻辑可溯、结构透明、可视化）。 三元组 （填空高频）： 实体 — 关系 — 实体（北京 — 是首都 — 中国） 实体 — 属性 — 属性值（北京市 — 人口 — 约 2000 万） 提示：模式层写\"概念/类别\"，数据层写\"具体实例\"，填空时先判断题干给的是哪一层。 知识图谱构建常见步骤：数据清洗 → 实体识别 → 关系抽取（再配合知识融合、质量评估等）。 模块四 · 算法（理解 + 对比表，不要死背） 学习方式三分法（务必区分）： 类型 有无标签 典型任务 代表算法 美术类比 监督学习 有标签 分类、回归 决策树、KNN、线性回归、逻辑回归 照着范画临摹 无监督学习 无标签 聚类 K-Means 自己把画作按风格分堆 强化学习 靠奖励反馈 决策控制 Q-Learning、AlphaGo 老师点评，试错改进 数据划分 ：训练集（练手）、验证集（调参）、测试集（最终考核）。 五件套辨析（选择题最爱考）： 线性回归 ：预测连续数值（如房价、销量）。用最小二乘法或梯度下降求参数，评价用 MSE。 逻辑回归 ：名字带回归，实际干 分类 ，输出概率，用极大似然估计。 KNN ：K 表示 预测时参考的最近邻居数量 （不是类别数！）。分类回归都能干。 K-Means ：聚类算法。步骤 = 初始化 K 个质心 → 把点分给最近质心 → 更新质心为簇内均值 → 迭代。\"选离质心最近的 K 个样本\"描述的是 KNN，不是 K-Means，注意偷换概念。 决策树 ：可解释性强、决策过程直观。场景题里\"根据多个条件判断是否放贷/分类\"→ 决策树。 神经网络三兄弟： 网络 擅长 记忆钩子 CNN 卷积神经网络 图像分类、视觉任务 C 画师，看局部笔触拼整体 RNN 循环神经网络 序列数据：文本、语音、时间序列 一帧接一帧地看动画 Transformer 注意力机制，大模型底座 一眼看全画面，理清元素关系 训练效果判断： 训练集表现差、测试集也差 → 欠拟合 （功底不够）； 训练集极好、测试集明显变差 → 过拟合 （只背会了这一张临摹，换角度就崩）。 缓解过拟合：增加数据、正则化、Dropout、早停等。 生成式 AI： 核心特征： 从数据中创造新内容 （生成图、文、音、视频，而不是只做分类判断）。 代表技术：GAN、扩散模型、大语言模型。 判断场景题：\"动态生成个性化练习题\"属于生成式 AI；\"统计高频问题出报告\"不是。 模块五 · 大模型应用（你的主场，重点拿分） 提示工程： 目的： 通过设计输入指令，引导模型生成符合期望的输出 （不改模型参数！）。 常用技巧：角色设定、思维链（CoT：把复杂任务分解成步骤）、少样本示例、多模态输入。 ICIO 框架 （填空高频，背熟四个字母）： I nstruction 指令：要模型做什么（如\"制定北京三日游计划\"） C ontext 背景：给谁用、预算、约束条件 I nput Data 输入数据：素材、已知信息（如出发地、偏好、已订门票） O utput Indicator 输出要求：格式、数量、字数、必须包含的要素 美术类比：ICIO 就是一份标准 约稿需求单 ——画什么 / 给谁画 / 参考素材 / 交付规格。 大模型增强手段对比： 技术 干什么 关键词 提示工程 改输入，不动模型 零成本、最快 RAG 检索增强 外接知识库再回答 知识更新、减少幻觉 全参数微调 重训整个模型 效果好、贵 LoRA 只训练少量附加参数 低成本、省算力、适合资源受限 智能代理（Agent）：能追问细节、调用工具、外接知识库 → 场景题里\"要求主动追问\"的客服系统选它。 场景判断题： 金融领域 不适合 大语言模型的是：实时高频交易（要求毫秒级确定性，LLM 不是干这个的）； 医疗要提升专业准确性 → 引入 专家标注的 专业数据集； 降低算力需求但保性能 → 模型轻量化。 模块六 · 安全与伦理（送分 + 价值观题） 隐私保护三原则： 数据最小化 （只收集必要数据）、授权同意、加密存储。 高频场景判断： 误采集用户未授权录音 → 立即删除数据并关闭非必要采集； 病历敏感信息 → 加密 + 访问认证； 过度采集（人脸、身份证、家庭成员信息）→ 违背最小化原则。 算法偏见：缓解手段是 增加公平性评估/统计检验 ，而不是\"加大模型\"或\"减少训练\"。 AI 伦理：AI 是 辅助 决策，不是替代人承担责任。 发展趋势：多模态、轻量化、端侧部署、推理成本持续下降。","chars":3199},{"id":"s4","title":"四、4 道综合填空题保底攻略（20 分）","tab":"四、4 道综合填空题保底攻略","html":"<p>官方样题的填空就四种套路，考前各练 2 遍：</p>\n<ol>\n<li><strong>三元组填空</strong>：先判断模式层（概念）还是数据层（实例），再按&quot;实体—关系—实体 / 实体—属性—属性值&quot;套。<strong>这题必须全对，等于白送。</strong></li>\n<li><strong>计算量算术</strong>：就是乘法！帧数 × 点数 × 运算次数。小心&quot;每帧/每秒&quot;和&quot;万/亿&quot;单位换算，草稿纸列竖式。</li>\n<li><strong>统计计算</strong>：均值、方差、协方差、回归系数 a=Cov(x,y)/Var(x)、b=ȳ−a·x̄、代入预测。<ul>\n<li>题目一般会给协方差和方差，重点是<strong>算准除法和按题目要求保留小数位</strong>。</li>\n</ul>\n</li>\n<li><strong>ICIO 填空</strong>：逐句对应——&quot;做什么&quot;填 Instruction，&quot;给谁/约束&quot;填 Context，&quot;素材信息&quot;填 Input Data，&quot;格式要求&quot;填 Output Indicator。</li>\n</ol>\n<p><strong>顺带记住两个常考指标（选择题会出）：</strong></p>\n<ul>\n<li>召回率 = 真正例 ÷ 实际正例总数（例：20 人患病，识别出 18 人 → 90%）；</li>\n<li>MSE 均方误差 = 各误差平方的平均值。</li>\n</ul>\n<hr>\n","text":"官方样题的填空就四种套路，考前各练 2 遍： 三元组填空 ：先判断模式层（概念）还是数据层（实例），再按\"实体—关系—实体 / 实体—属性—属性值\"套。 这题必须全对，等于白送。 计算量算术 ：就是乘法！帧数 × 点数 × 运算次数。小心\"每帧/每秒\"和\"万/亿\"单位换算，草稿纸列竖式。 统计计算 ：均值、方差、协方差、回归系数 a=Cov(x,y)/Var(x)、b=ȳ−a·x̄、代入预测。 题目一般会给协方差和方差，重点是 算准除法和按题目要求保留小数位 。 ICIO 填空 ：逐句对应——\"做什么\"填 Instruction，\"给谁/约束\"填 Context，\"素材信息\"填 Input Data，\"格式要求\"填 Output Indicator。 顺带记住两个常考指标（选择题会出）： 召回率 = 真正例 ÷ 实际正例总数（例：20 人患病，识别出 18 人 → 90%）； MSE 均方误差 = 各误差平方的平均值。","chars":415},{"id":"s5","title":"五、多选题技巧（30 分怎么拿）","tab":"五、多选题技巧","html":"<ol>\n<li><strong>看否定词</strong>：题目问&quot;不属于&quot;&quot;不正确&quot;时先圈出来，避免惯性选对。</li>\n<li><strong>排除绝对化表述</strong>：&quot;所有&quot;&quot;均&quot;&quot;完全&quot;&quot;仅&quot;&quot;无法&quot;基本是坑（如&quot;NPU 适用于所有计算任务&quot;）。</li>\n<li><strong>选项成对出现时警惕</strong>：互相矛盾的选项往往一对一错。</li>\n<li><strong>评分规则以当次机考系统说明为准</strong>，很多机考多选题是&quot;少选、多选、错选均不得分&quot;——所以不要靠蒙半截，优先选<strong>有明确知识点支撑</strong>的选项，拿不准的先用排除法。</li>\n<li>90 分钟时间分配建议：单选 30 分钟 → 多选 25 分钟 → 填空 30 分钟 → 检查 5 分钟。选择题不倒扣，<strong>空的必须蒙满</strong>。</li>\n</ol>\n<hr>\n","text":"看否定词 ：题目问\"不属于\"\"不正确\"时先圈出来，避免惯性选对。 排除绝对化表述 ：\"所有\"\"均\"\"完全\"\"仅\"\"无法\"基本是坑（如\"NPU 适用于所有计算任务\"）。 选项成对出现时警惕 ：互相矛盾的选项往往一对一错。 评分规则以当次机考系统说明为准 ，很多机考多选题是\"少选、多选、错选均不得分\"——所以不要靠蒙半截，优先选 有明确知识点支撑 的选项，拿不准的先用排除法。 90 分钟时间分配建议：单选 30 分钟 → 多选 25 分钟 → 填空 30 分钟 → 检查 5 分钟。选择题不倒扣， 空的必须蒙满 。","chars":257},{"id":"s6","title":"六、考前 1 小时速记卡","tab":"六、考前 1 小时速记卡","html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>看到什么</th>\n<th>选什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>图像分类 / 视觉</td>\n<td>CNN</td>\n</tr>\n<tr>\n<td>序列 / 文本 / 语音</td>\n<td>RNN</td>\n</tr>\n<tr>\n<td>大模型底座 / 注意力</td>\n<td>Transformer</td>\n</tr>\n<tr>\n<td>聚类 / 质心</td>\n<td>K-Means</td>\n</tr>\n<tr>\n<td>参考最近邻数量</td>\n<td>KNN</td>\n</tr>\n<tr>\n<td>可解释的分类决策</td>\n<td>决策树</td>\n</tr>\n<tr>\n<td>预测连续数值</td>\n<td>线性回归</td>\n</tr>\n<tr>\n<td>输出概率做分类</td>\n<td>逻辑回归</td>\n</tr>\n<tr>\n<td>低时延 / 现场处理</td>\n<td>边缘计算</td>\n</tr>\n<tr>\n<td>大规模并行 / 渲染 / 训练</td>\n<td>GPU</td>\n</tr>\n<tr>\n<td>神经网络推理加速</td>\n<td>NPU</td>\n</tr>\n<tr>\n<td>省算力微调</td>\n<td>LoRA</td>\n</tr>\n<tr>\n<td>外接知识库降低幻觉</td>\n<td>RAG</td>\n</tr>\n<tr>\n<td>引导输出不改模型</td>\n<td>提示工程</td>\n</tr>\n<tr>\n<td>约稿需求四件套</td>\n<td>ICIO</td>\n</tr>\n<tr>\n<td>只收集必要数据</td>\n<td>数据最小化原则</td>\n</tr>\n<tr>\n<td>训练好测试差</td>\n<td>过拟合</td>\n</tr>\n<tr>\n<td>AI 胡说八道</td>\n<td>幻觉</td>\n</tr>\n<tr>\n<td>推理成本大降（2025）</td>\n<td>DeepSeek-R1</td>\n</tr>\n<tr>\n<td>深度学习革命起点（2012）</td>\n<td>AlexNet</td>\n</tr>\n</tbody></table></div>\n<hr>\n","text":"看到什么 选什么 图像分类 / 视觉 CNN 序列 / 文本 / 语音 RNN 大模型底座 / 注意力 Transformer 聚类 / 质心 K-Means 参考最近邻数量 KNN 可解释的分类决策 决策树 预测连续数值 线性回归 输出概率做分类 逻辑回归 低时延 / 现场处理 边缘计算 大规模并行 / 渲染 / 训练 GPU 神经网络推理加速 NPU 省算力微调 LoRA 外接知识库降低幻觉 RAG 引导输出不改模型 提示工程 约稿需求四件套 ICIO 只收集必要数据 数据最小化原则 训练好测试差 过拟合 AI 胡说八道 幻觉 推理成本大降（2025） DeepSeek-R1 深度学习革命起点（2012） AlexNet","chars":316},{"id":"s7","title":"七、考试当天清单","tab":"七、考试当天清单","html":"<ul>\n<li><input type=\"checkbox\" data-ck=\"nc1guide-7-0\"> <strong>今天就打印准考证</strong>：报名网站 ncre-bm.neea.edu.cn（考前一周开放，别拖）</li>\n<li><input type=\"checkbox\" data-ck=\"nc1guide-7-1\"> 身份证原件 + 准考证，提前 30 分钟到考场</li>\n<li><input type=\"checkbox\" data-ck=\"nc1guide-7-2\"> 手机、智能手表不得带入，以考点规定为准</li>\n<li><input type=\"checkbox\" data-ck=\"nc1guide-7-3\"> 填空题看清&quot;保留几位小数&quot;，算完再检查一遍单位</li>\n<li><input type=\"checkbox\" data-ck=\"nc1guide-7-4\"> 选择题全部作答，不留空白</li>\n<li><input type=\"checkbox\" data-ck=\"nc1guide-7-5\"> 交卷前确认填空题 4 道都点了&quot;保存&quot;</li>\n</ul>\n<hr>\n","text":"今天就打印准考证 ：报名网站 ncre-bm.neea.edu.cn（考前一周开放，别拖 d>达特茅斯会议，麦卡锡提出&quot;人工智能&quot;</td>\n<td>AI 的生日</td>\n</tr>\n<tr>\n<td>1997</td>\n<td>深蓝战胜国际象棋世界冠军</td>\n<td>先赢棋</td>\n</tr>\n<tr>\n<td>2012</td>\n<td>AlexNet 夺得 ImageNet 冠军</td>\n<td>深度学习革命起点</td>\n</tr>\n<tr>\n<td>2016</td>\n<td>AlphaGo 战胜李世石</td>\n<td>再赢围棋</td>\n</tr>\n<tr>\n<td>2017</td>\n<td>Transformer 架构提出</td>\n<td>大模型的地基</td>\n</tr>\n<tr>\n<td>2020</td>\n<td>GPT-3 发布</td>\n<td>大模型规模起飞</td>\n</tr>\n<tr>\n<td>2022</td>\n<td>ChatGPT 发布</td>\n<td>AI 出圈元年</td>\n</tr>\n<tr>\n<td>2025</td>\n<td>DeepSeek-R1 发布</td>\n<td>推理成本大幅降低</td>\n</tr>\n</tbody></table></div>\n<h3>1.2 必背概念</h3>\n<ul>\n<li><strong>弱人工智能</strong>：只能在特定领域完成特定任务（现在所有 AI 都是弱 AI）。</li>\n<li><strong>强人工智能</strong>：具备自主意识与决策能力（尚未实现）。</li>\n<li><strong>通用人工智能（AGI）</strong>：关键词是&quot;<strong>跨领域</strong>应用能力&quot;。</li>\n<li><strong>三大学派</strong>：符号主义、联结主义、行为主义。当前深度学习属于<strong>联结主义</strong>占主导。</li>\n<li><strong>技术领域</strong>：计算机视觉（CV）、自然语言处理（NLP）、语音识别、机器人技术、机器学习等。</li>\n<li><strong>生成式人工智能</strong>：核心能力是&quot;<strong>从数据中创造新内容</strong>&quot;（生成文、图、音、视频），而不是只做判断分类。</li>\n</ul>\n<h3>1.3 大语言模型：特征、应用、局限</h3>\n<p><strong>四大核心特征（必背）：</strong></p>\n<ol>\n<li>基于 <strong>Transformer</strong> 等深度架构的多层神经网络；</li>\n<li><strong>参数规模庞大</strong>；</li>\n<li>依赖<strong>海量训练数据</strong>（&quot;不需要大量训练数据&quot;是错误说法，高频陷阱）；</li>\n<li>具备<strong>多任务泛化能力</strong>。</li>\n</ol>\n<p><strong>核心方法链条</strong>：预训练（海量无标签数据学语言规律）→ 微调 → 提示工程。</p>\n<p><strong>主要应用</strong>：对话问答、写作、编程、图像生成、教育、医疗、金融、办公。</p>\n<p><strong>主要局限（考点）</strong>：</p>\n<ul>\n<li><strong>幻觉</strong>：生成看似合理、实际错误或虚构的内容；</li>\n<li><strong>偏见</strong>：来自训练数据；</li>\n<li><strong>知识截止</strong>：不知道训练日期之后的事；</li>\n<li><strong>成本高</strong>：算力消耗大。</li>\n</ul>\n<p><strong>美术生类比</strong>：大模型像一个&quot;看遍了全天下的画&quot;的临摹高手——什么都能画，但偶尔会把没见过的细节&quot;脑补&quot;出来（幻觉），而且它只会照着见过的画风画（知识截止）。</p>\n<h3>1.4 背完自测清单（打勾）</h3>\n<ul>\n<li><input type=\"checkbox\" data-ck=\"nc1d1-1-0\"> 我能按顺序说出 9 个时间节点</li>\n<li><input type=\"checkbox\" data-ck=\"nc1d1-1-1\"> 我能一句话区分弱 AI / 强 AI</li>\n<li><input type=\"checkbox\" data-ck=\"nc1d1-1-2\"> 我能背出大语言模型四大特征</li>\n<li><input type=\"checkbox\" data-ck=\"nc1d1-1-3\"> 我能说出幻觉、偏见、知识截止、成本四个局限</li>\n</ul>\n<hr>\n<h2>模块二 算力</h2>\n<h3>2.1 处理器分工表（必背）</h3>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>处理器</th>\n<th>特长</th>\n<th>典型任务</th>\n<th>记忆钩子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>CPU</td>\n<td>指令解析、通用计算、控制逻辑</td>\n<td>系统控制、数据管理</td>\n<td>总导演</td>\n</tr>\n<tr>\n<td>GPU</td>\n<td>大规模<strong>并行</strong>计算</td>\n<td>3D 渲染、深度学习训练/推理</td>\n<td>图形起家</td>\n</tr>\n<tr>\n<td>NPU</td>\n<td>神经网络专用加速</td>\n<td>推理阶段矩阵运算</td>\n<td>专精一个画风的高手</td>\n</tr>\n<tr>\n<td>TPU</td>\n<td>张量处理专用芯片</td>\n<td>深度学习加速</td>\n<td>谷歌自研</td>\n</tr>\n</tbody></table></div>\n<p><strong>高频陷阱</strong>：「NPU 适用于所有计算任务」→ 错，它是专用加速器。</p>\n<p><strong>智能计算核心加速组件</strong>：GPU、NPU、TPU（网络处理器不属于）。</p>\n<h3>2.2 算力构成与度量</h3>\n<ul>\n<li><strong>算力三要素</strong>：处理器性能、数据传输能力、并行计算能力。（&quot;数据加密能力&quot;不属于！）</li>\n<li><strong>度量单位</strong>：FLOPS = 每秒浮点运算次数；<ul>\n<li><strong>1 PFLOPS = 1000 TFLOPS</strong>（这是常见换算考法）。</li>\n</ul>\n</li>\n<li><strong>训练 vs 推理</strong>：训练需要海量算力（几天~几个月）；推理是模型上线后每次干活的算力，单次需求小但总量可观。</li>\n<li><strong>计算量公式</strong>：<strong>单帧计算量 = 每帧点数 × 每点运算次数；每秒总计算量 = 帧数 × 单帧计算量</strong>。</li>\n</ul>\n<h3>2.3 云计算 vs 边缘计算</h3>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th>云计算</th>\n<th>边缘计算</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>位置</td>\n<td>集中式数据中心</td>\n<td>靠近数据源（设备端）</td>\n</tr>\n<tr>\n<td>优势</td>\n<td>弹性扩展、按需服务、大规模</td>\n<td><strong>低时延、低功耗</strong>、省带宽</td>\n</tr>\n<tr>\n<td>场景</td>\n<td>大模型训练、海量数据处理</td>\n<td>摄像头实时识别、自动驾驶、智能音箱唤醒</td>\n</tr>\n<tr>\n<td>美术类比</td>\n<td>回大画室画大画</td>\n<td>现场速写立刻出结果</td>\n</tr>\n</tbody></table></div>\n<p><strong>判断口诀</strong>：题目出现&quot;低时延 / 实时 / 本地处理 / 摄像头端过滤&quot;→ 选<strong>边缘计算</strong>。</p>\n<h3>2.4 背完自测清单</h3>\n<ul>\n<li><input type=\"checkbox\" data-ck=\"nc1d1-1-4\"> 我能说出 CPU / GPU / NPU / TPU 各自擅长什么</li>\n<li><input type=\"checkbox\" data-ck=\"nc1d1-1-5\"> 我记得 1 PFLOPS = 1000 TFLOPS</li>\n<li><input type=\"checkbox\" data-ck=\"nc1d1-1-6\"> 我能背出算力三要素（且知道数据加密不是）</li>\n<li><input type=\"checkbox\" data-ck=\"nc1d1-1-7\"> 我能用一句话区分云计算和边缘计算</li>\n<li><input type=\"checkbox\" data-ck=\"nc1d1-1-8\"> 我会用&quot;帧数 × 点数 × 运算次数&quot;算计算量</li>\n</ul>\n<hr>\n<h2>模块三 数据</h2>\n<h3>3.1 数据分类（必背对比）</h3>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>类型</th>\n<th>例子</th>\n<th>特征</th>\n<th>记忆钩子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>结构化</td>\n<td>表格、数据库、Excel、CSV</td>\n<td>行列整齐，可直接查询</td>\n<td>排好版的画册目录</td>\n</tr>\n<tr>\n<td>半结构化</td>\n<td>XML、JSON</td>\n<td>有标签/键值结构，但格式灵活</td>\n<td>带便签的素材堆</td>\n</tr>\n<tr>\n<td>非结构化</td>\n<td>文本、图像、音频、视频</td>\n<td>无固定格式，占 AI 数据大头</td>\n<td>画室大杂烩</td>\n</tr>\n</tbody></table></div>\n<ul>\n<li><strong>XML</strong>：基于<strong>标签</strong>设计，标签可自定义，支持注释。</li>\n<li><strong>JSON</strong>：基于<strong>键值对</strong>。</li>\n<li><strong>表格数据属于结构化数据</strong>（高频送分题）。</li>\n</ul>\n<h3>3.2 数据预处理与标注</h3>\n<ul>\n<li><strong>数据预处理四步</strong>：数据清洗 → 数据集成 → 数据变换 → 数据规约。</li>\n<li><strong>数据清洗</strong>：去除噪声、填补缺失值、修正错误数据、去重、处理异常值。</li>\n<li><strong>数据变换</strong>：归一化、标准化等（把不同量纲的数据拉到同一尺度）。</li>\n<li><strong>数据标注</strong>：给数据打上标签，<strong>为监督学习提供带标签的训练数据</strong>；标注质量直接影响模型效果，人工标注成本高。</li>\n<li><strong>数据增强</strong>：对图像做旋转、裁剪、翻转等，扩充训练样本。</li>\n<li><strong>数据集划分</strong>：训练集（学）、验证集（调）、测试集（考，最终评估泛化能力）。</li>\n</ul>\n<h3>3.3 知识表示与知识图谱</h3>\n<ul>\n<li><strong>知识表示</strong>的最核心目标：把知识转化为<strong>机器可处理的形式</strong>。</li>\n<li><strong>知识库 vs 知识图谱</strong>：知识库侧重<strong>存储</strong>；知识图谱强调<strong>图结构表示和语义关联</strong>。</li>\n<li><strong>知识图谱的可解释性</strong>体现在：逻辑可溯、结构透明、可视化。</li>\n<li><strong>三元组（必背，填空题白送分）</strong>：<ul>\n<li>实体 — 关系 — 实体：北京 — 是首都 — 中国</li>\n<li>实体 — 属性 — 属性值：北京市 — 人口 — 约 2000 万</li>\n</ul>\n</li>\n<li><strong>模式层 vs 数据层</strong>：模式层写概念框架（如&quot;城市—位于—国家&quot;）；数据层写具体事实（如&quot;上海—位于—中国&quot;）。</li>\n<li><strong>知识图谱构建步骤</strong>：数据清洗 → 实体识别 → 关系抽取 → 知识融合 → 知识加工。</li>\n</ul>\n<h3>3.4 数据安全小口径（了解即可）</h3>\n<ul>\n<li>数据最小化：只收集必要数据；授权同意；加密存储。</li>\n</ul>\n<h3>3.5 背完自测清单</h3>\n<ul>\n<li><input type=\"checkbox\" data-ck=\"nc1d1-1-9\"> 我能给结构化 / 半结构化 / 非结构化各举 2 个例子</li>\n<li><input type=\"checkbox\" data-ck=\"nc1d1-1-10\"> 我能背出 XML 和 JSON 的区别（标签 vs 键值对）</li>\n<li><input type=\"checkbox\" data-ck=\"nc1d1-1-11\"> 我能背出数据预处理四步和清洗的作用</li>\n<li><input type=\"checkbox\" data-ck=\"nc1d1-1-12\"> 我能写出两种三元组形式</li>\n<li><input type=\"checkbox\" data-ck=\"nc1d1-1-13\"> 我能说出知识图谱构建的 5 个步骤</li>\n</ul>\n<hr>\n","text":"模块一 基本概念 1.1 必背时间线 年份 事件 一句话记忆 1950 图灵提出图灵测试 机器会\"装人\"才算智能 1956 达特茅斯会议，麦卡锡提出\"人工智能\" AI 的生日 1997 深蓝战胜国际象棋世界冠军 先赢棋 2012 AlexNet 夺得 ImageNet 冠军 深度学习革命起点 2016 AlphaGo 战胜李世石 再赢围棋 2017 Transformer 架构提出 大模型的地基 2020 GPT-3 发布 大模型规模起飞 2022 ChatGPT 发布 AI 出圈元年 2025 DeepSeek-R1 发布 推理成本大幅降低 1.2 必背概念 弱人工智能 ：只能在特定领域完成特定任务（现在所有 AI 都是弱 AI）。 强人工智能 ：具备自主意识与决策能力（尚未实现）。 通用人工智能（AGI） ：关键词是\" 跨领域 应用能力\"。 三大学派 ：符号主义、联结主义、行为主义。当前深度学习属于 联结主义 占主导。 技术领域 ：计算机视觉（CV）、自然语言处理（NLP）、语音识别、机器人技术、机器学习等。 生成式人工智能 ：核心能力是\" 从数据中创造新内容 \"（生成文、图、音、视频），而不是只做判断分类。 1.3 大语言模型：特征、应用、局限 四大核心特征（必背）： 基于 Transformer 等深度架构的多层神经网络； 参数规模庞大 ； 依赖 海量训练数据 （\"不需要大量训练数据\"是错误说法，高频陷阱）； 具备 多任务泛化能力 。 核心方法链条 ：预训练（海量无标签数据学语言规律）→ 微调 → 提示工程。 主要应用 ：对话问答、写作、编程、图像生成、教育、医疗、金融、办公。 主要局限（考点） ： 幻觉 ：生成看似合理、实际错误或虚构的内容； 偏见 ：来自训练数据； 知识截止 ：不知道训练日期之后的事； 成本高 ：算力消耗大。 美术生类比 ：大模型像一个\"看遍了全天下的画\"的临摹高手——什么都能画，但偶尔会把没见过的细节\"脑补\"出来（幻觉），而且它只会照着见过的画风画（知识截止）。 1.4 背完自测清单（打勾） 我能按顺序说出 9 个时间节点 我能一句话区分弱 AI / 强 AI 我能背出大语言模型四大特征 我能说出幻觉、偏见、知识截止、成本四个局限 模块二 算力 2.1 处理器分工表（必背） 处理器 特长 典型任务 记忆钩子 CPU 指令解析、通用计算、控制逻辑 系统控制、数据管理 总导演 GPU 大规模 并行 计算 3D 渲染、深度学习训练/推理 图形起家 NPU 神经网络专用加速 推理阶段矩阵运算 专精一个画风的高手 TPU 张量处理专用芯片 深度学习加速 谷歌自研 高频陷阱 ：「NPU 适用于所有计算任务」→ 错，它是专用加速器。 智能计算核心加速组件 ：GPU、NPU、TPU（网络处理器不属于）。 2.2 算力构成与度量 算力三要素 ：处理器性能、数据传输能力、并行计算能力。（\"数据加密能力\"不属于！） 度量单位 ：FLOPS = 每秒浮点运算次数； 1 PFLOPS = 1000 TFLOPS （这是常见换算考法）。 训练 vs 推理 ：训练需要海量算力（几天~几个月）；推理是模型上线后每次干活的算力，单次需求小但总量可观。 计算量公式 ： 单帧计算量 = 每帧点数 × 每点运算次数；每秒总计算量 = 帧数 × 单帧计算量 。 2.3 云计算 vs 边缘计算 云计算 边缘计算 位置 集中式数据中心 靠近数据源（设备端） 优势 弹性扩展、按需服务、大规模 低时延、低功耗 、省带宽 场景 大模型训练、海量数据处理 摄像头实时识别、自动驾驶、智能音箱唤醒 美术类比 回大画室画大画 现场速写立刻出结果 判断口诀 ：题目出现\"低时延 / 实时 / 本地处理 / 摄像头端过滤\"→ 选 边缘计算 。 2.4 背完自测清单 我能说出 CPU / GPU / NPU / TPU 各自擅长什么 我记得 1 PFLOPS = 1000 TFLOPS 我能背出算力三要素（且知道数据加密不是） 我能用一句话区分云计算和边缘计算 我会用\"帧数 × 点数 × 运算次数\"算计算量 模块三 数据 3.1 数据分类（必背对比） 类型 例子 特征 记忆钩子 结构化 表格、数据库、Excel、CSV 行列整齐，可直接查询 排好版的画册目录 半结构化 XML、JSON 有标签/键值结构，但格式灵活 带便签的素材堆 非结构化 文本、图像、音频、视频 无固定格式，占 AI 数据大头 画室大杂烩 XML ：基于 标签 设计，标签可自定义，支持注释。 JSON ：基于 键值对 。 表格数据属于结构化数据 （高频送分题）。 3.2 数据预处理与标注 数据预处理四步 ：数据清洗 → 数据集成 → 数据变换 → 数据规约。 数据清洗 ：去除噪声、填补缺失值、修正错误数据、去重、处理异常值。 数据变换 ：归一化、标准化等（把不同量纲的数据拉到同一尺度）。 数据标注 ：给数据打上标签， 为监督学习提供带标签的训练数据 ；标注质量直接影响模型效果，人工标注成本高。 数据增强 ：对图像做旋转、裁剪、翻转等，扩充训练样本。 数据集划分 ：训练集（学）、验证集（调）、测试集（考，最终评估泛化能力）。 3.3 知识表示与知识图谱 知识表示 的最核心目标：把知识转化为 机器可处理的形式 。 知识库 vs 知识图谱 ：知识库侧重 存储 ；知识图谱强调 图结构表示和语义关联 。 知识图谱的可解释性 体现在：逻辑可溯、结构透明、可视化。 三元组（必背，填空题白送分） ： 实体 — 关系 — 实体：北京 — 是首都 — 中国 实体 — 属性 — 属性值：北京市 — 人口 — 约 2000 万 模式层 vs 数据层 ：模式层写概念框架（如\"城市—位于—国家\"）；数据层写具体事实（如\"上海—位于—中国\"）。 知识图谱构建步骤 ：数据清洗 → 实体识别 → 关系抽取 → 知识融合 → 知识加工。 3.4 数据安全小口径（了解即可） 数据最小化：只收集必要数据；授权同意；加密存储。 3.5 背完自测清单 我能给结构化 / 半结构化 / 非结构化各举 2 个例子 我能背出 XML 和 JSON 的区别（标签 vs 键值对） 我能背出数据预处理四步和清洗的作用 我能写出两种三元组形式 我能说出知识图谱构建的 5 个步骤","chars":2624},{"id":"s2","title":"第二部分 · 练习题（闭卷做，别看答案）","tab":"练习题","html":"<blockquote>\n<p>建议：单选每题 1 分钟、多选每题 2 分钟、判断 30 秒。做完再去第三部分对答案。</p>\n</blockquote>\n<h2>A 组 · 基本概念</h2>\n<h3>A1 单项选择题（12 题）</h3>\n<ol>\n<li><p>&quot;人工智能（AI）&quot;这一术语正式提出的标志性会议是：<br>A）1950 年图灵测试的提出<br>B）1956 年达特茅斯会议<br>C）1997 年深蓝战胜国际象棋冠军<br>D）2012 年 AlexNet 夺得 ImageNet 冠军</p>\n</li>\n<li><p>提出&quot;人工智能&quot;概念、被称为&quot;人工智能之父&quot;的科学家是：<br>A）艾伦·图灵<br>B）约翰·麦卡锡<br>C）杰弗里·辛顿<br>D）蒂姆·伯纳斯-李</p>\n</li>\n<li><p>被称为&quot;深度学习革命&quot;起点的事件是：<br>A）深蓝战胜卡斯帕罗夫<br>B）AlexNet 在 ImageNet 竞赛中夺冠<br>C）AlphaGo 战胜李世石<br>D）GPT-3 发布</p>\n</li>\n<li><p>AlphaGo 战胜围棋世界冠军李世石发生在：<br>A）2012 年<br>B）2014 年<br>C）2016 年<br>D）2018 年</p>\n</li>\n<li><p>当前大模型的&quot;地基&quot;——Transformer 架构提出于：<br>A）2012 年<br>B）2015 年<br>C）2017 年<br>D）2020 年</p>\n</li>\n<li><p>2025 年发布的 DeepSeek-R1 最重要的突破是：<br>A）推理的算力成本大幅降低<br>B）首次实现多模态生成<br>C）参数规模达到万亿级<br>D）实现了通用人工智能</p>\n</li>\n<li><p>弱人工智能与强人工智能的核心区别在于：<br>A）是否具备自主意识与决策能力<br>B）是否依赖大数据<br>C）是否使用神经网络<br>D）是否使用机器学习</p>\n</li>\n<li><p>对当前人工智能发展阶段描述最恰当的是：<br>A）符号主义主导阶段<br>B）依赖人工标注数据的阶段<br>C）多模态大模型与通用人工智能探索阶段<br>D）强人工智能普及阶段</p>\n</li>\n<li><p>当前深度学习技术属于三大学派中的：<br>A）符号主义<br>B）联结主义<br>C）行为主义<br>D）经验主义</p>\n</li>\n<li><p>下列<strong>不属于</strong>大语言模型核心特征的是：<br>A）基于 Transformer 等深度架构的多层神经网络<br>B）无需大量训练数据<br>C）参数规模庞大<br>D）具备多任务泛化能力</p>\n</li>\n<li><p>某教育平台为不同学习进度的学生<strong>动态生成个性化的练习题和答案解析</strong>，这最能体现生成式人工智能的哪种能力：<br>A）对学生的知识薄弱点自动归类<br>B）从数据中创造新内容<br>C）按预设课程大纲自动推送任务<br>D）识别论坛中的高频问题并生成统计报告</p>\n</li>\n<li><p>大语言模型的&quot;幻觉（Hallucination）&quot;是指：<br>A）模型运行速度突然变慢<br>B）模型生成看似合理、实际错误或虚构的内容<br>C）模型无法识别图像<br>D）模型参数丢失</p>\n</li>\n</ol>\n<h3>A2 多项选择题（4 题，每题 5 个选项）</h3>\n<ol>\n<li><p>关于大语言模型的特征，下列说法正确的有：<br>A）基于 Transformer 等深度架构的多层神经网络<br>B）参数规模庞大<br>C）具备多任务泛化能力<br>D）无需训练数据即可获得语言能力<br>E）可通过提示工程引导其输出</p>\n</li>\n<li><p>下列属于人工智能典型技术领域的有：<br>A）计算机视觉<br>B）自然语言处理<br>C）语音识别<br>D）机器人技术<br>E）活字印刷技术</p>\n</li>\n<li><p>下列属于大模型局限性或风险的有：<br>A）可能生成与事实不符的&quot;幻觉&quot;内容<br>B）训练数据可能带来偏见<br>C）知识存在截止时间<br>D）训练与部署成本高<br>E）永远不会出错</p>\n</li>\n<li><p>下列属于弱人工智能应用的有：<br>A）人脸识别闸机<br>B）智能音箱语音助手<br>C）机器翻译软件<br>D）具备自我意识的机器人<br>E）围棋 AI（AlphaGo）</p>\n</li>\n</ol>\n<h3>A3 判断题（3 题）</h3>\n<ol>\n<li>目前人类已经实现的所有人工智能都属于弱人工智能。（ ）</li>\n<li>模型参数规模越大，模型效果就一定越好。（ ）</li>\n<li>ChatGPT 于 2020 年发布。（ ）</li>\n</ol>\n<hr>\n<h2>B 组 · 算力</h2>\n<h3>B1 单项选择题（10 题）</h3>\n<ol>\n<li><p>在现代计算机系统中，承担&quot;指令解析与通用计算&quot;任务的核心部件是：<br>A）CPU<br>B）GPU<br>C）NPU<br>D）显示器</p>\n</li>\n<li><p>GPU 最初被设计用于：<br>A）数据库查询<br>B）图形渲染<br>C）文字处理<br>D）网络通信</p>\n</li>\n<li><p>NPU 的主要用途是：<br>A）通用办公软件运行<br>B）神经网络相关计算（尤其推理阶段）的加速<br>C）硬盘存储管理<br>D）电源管理</p>\n</li>\n<li><p>下列<strong>不属于</strong>智能计算核心加速组件的是：<br>A）图形处理器（GPU）<br>B）神经网络处理器（NPU）<br>C）张量处理器（TPU）<br>D）网络处理器</p>\n</li>\n<li><p>某智慧城市系统要求摄像头数据&quot;就地处理、低时延&quot;，最适合的技术是：<br>A）边缘计算<br>B）内存扩容<br>C）传统云计算集中处理<br>D）增加显示器数量</p>\n</li>\n<li><p>下列<strong>不属于</strong>算力构成要素的是：<br>A）处理器性能<br>B）数据传输能力<br>C）并行计算能力<br>D）数据加密能力</p>\n</li>\n<li><p>1 PFLOPS 等于多少 TFLOPS：<br>A）10<br>B）100<br>C）1000<br>D）10000</p>\n</li>\n<li><p>关于 TPU，下列说法正确的是：<br>A）是专门为张量运算设计的处理器<br>B）是一种显示器接口标准<br>C）是硬盘的一种类型<br>D）是操作系统名称</p>\n</li>\n<li><p>云计算的典型特征是：<br>A）集中式处理、弹性扩展、按需服务<br>B）必须在本地运行<br>C）无法处理大规模数据<br>D）只适用于手机</p>\n</li>\n<li><p>与&quot;训练&quot;相比，关于&quot;推理&quot;算力需求的说法正确的是：<br>A）推理通常单次计算量小于训练<br>B）推理完全不需要算力<br>C）推理只能由 CPU 完成<br>D）推理比训练贵一百倍</p>\n</li>\n</ol>\n<h3>B2 多项选择题（4 题）</h3>\n<ol>\n<li><p>关于现代处理器的功能特性，下列说法正确的有：<br>A）CPU 是计算机核心组件，承担指令解析与通用计算任务<br>B）GPU 凭借大规模并行架构，在 3D 渲染任务中效率显著高于 CPU<br>C）NPU 主要用于推理阶段的矩阵运算加速<br>D）GPU 在图像卷积运算中通常比 CPU 快<br>E）NPU 适用于所有计算任务</p>\n</li>\n<li><p>下列属于算力构成要素的有：<br>A）处理器性能<br>B）数据传输能力<br>C）并行计算能力<br>D）数据加密能力<br>E）软件开发能力</p>\n</li>\n<li><p>关于云计算与边缘计算，下列说法正确的有：<br>A）云计算适合大规模集中处理<br>B）边缘计算可以降低时延<br>C）边缘计算适合低功耗、实时性要求高的场景<br>D）边缘计算将完全取代云计算<br>E）在摄像头端过滤无用背景特征，属于边缘计算思路</p>\n</li>\n<li><p>某城市智慧安防系统要从大量摄像头视频中快速识别异常行为，下列做法正确的有：<br>A）采用更高效的算法模型，在保持精度的同时降低计算量<br>B）部署边缘计算设备，在摄像头端先过滤无用的背景特征<br>C）动态分配算力，在人流密集区域增加计算资源<br>D）让 CPU 负责包括矩阵运算在内的全部任务<br>E）为了省算力，大幅降低识别精度</p>\n</li>\n</ol>\n<h3>B3 判断题（2 题）</h3>\n<ol>\n<li>NPU 适用于所有计算任务。（ ）</li>\n<li>GPU 的大规模并行架构在深度学习训练中效率显著高于 CPU。（ ）</li>\n</ol>\n<h3>B4 计算填空题（1 题，共 5 空）</h3>\n<p>某自动驾驶车载计算平台需处理激光雷达与摄像头数据：</p>\n<p><strong>激光雷达</strong>：每秒处理 1000 帧，每帧包含 20 万个点，每个点需执行 4 次浮点运算。</p>\n<p>（1）单帧计算量 = ______ 次/帧；<br>（2）每秒总计算量 = ______ 次/秒。</p>\n<p><strong>摄像头</strong>：4 个摄像头，每路每秒拍摄 30 帧，每帧 AI 检测需 2000 次矩阵运算。</p>\n<p>（3）单摄像头计算量 = ______ 次/秒；<br>（4）4 个摄像头总计算量 = ______ 次/秒。</p>\n<p>（5）在该平台中，GPU 凭借大量 ______（并行/串行）计算单元，高效处理上述任务。</p>\n<hr>\n<h2>C 组 · 数据</h2>\n<h3>C1 单项选择题（11 题）</h3>\n<ol>\n<li><p>采用表格表达的数据属于：<br>A）非结构化数据<br>B）半结构化数据<br>C）结构化数据<br>D）图像数据</p>\n</li>\n<li><p>关于 XML 数据格式，描述正确的是：<br>A）基于标签设计，标签可自定义<br>B）不支持注释<br>C）基于键值对设计<br>D）只能由系统预定义标签</p>\n</li>\n<li><p>在数据预处理中，&quot;数据清洗&quot;的主要目的是：<br>A）去除噪声、填补缺失值、修正错误数据<br>B）提高数据维度以增强模型性能<br>C）对数据进行分类标注<br>D）把数据上传到云端</p>\n</li>\n<li><p>&quot;数据标注&quot;的核心作用是：<br>A）减少模型训练所需的数据量<br>B）为监督学习提供带标签的训练数据<br>C）提高数据存储容量<br>D）压缩数据体积</p>\n</li>\n<li><p>知识表示的最核心目标是：<br>A）增强数据可视化效果<br>B）提高数据存储效率<br>C）将知识转化为机器可处理的形式<br>D）加快网页加载速度</p>\n</li>\n<li><p>知识库与知识图谱的主要区别在于：<br>A）知识库侧重存储，知识图谱强调图结构表示和语义关联<br>B）知识库强调实体关系，知识图谱强调静态存储<br>C）知识库支持语义推理，知识图谱仅支持关键词检索<br>D）二者完全等价，没有区别</p>\n</li>\n<li><p>在知识图谱三元组&quot;上海—位于—中国&quot;中，&quot;上海&quot;是：<br>A）关系<br>B）实体<br>C）属性值<br>D）知识库</p>\n</li>\n<li><p>下列属于非结构化数据的是：<br>A）Excel 表格<br>B）数据库中的学生信息表<br>C）一段短视频文件<br>D）CSV 文件</p>\n</li>\n<li><p>JSON 数据格式的典型特征是：<br>A）基于键值对<br>B）只能存储图片<br>C）不支持嵌套结构<br>D）必须用中文编写</p>\n</li>\n<li><p>数据增强的常见方法是：<br>A）对图像进行旋转、裁剪、翻转等变换<br>B）删除一半训练数据<br>C）把数据压缩成 ZIP 包<br>D）将数据存到移动硬盘</p>\n</li>\n<li><p>数据集中用于<strong>最终评估模型泛化能力</strong>的是：<br>A）训练集<br>B）验证集<br>C）测试集<br>D）全集</p>\n</li>\n</ol>\n<h3>C2 多项选择题（4 题）</h3>\n<ol>\n<li><p>下列属于非结构化数据的有：<br>A）文本文件<br>B）图像<br>C）录音<br>D）视频<br>E）表格数据</p>\n</li>\n<li><p>下列属于知识图谱构建步骤的有：<br>A）数据清洗<br>B）实体识别<br>C）关系抽取<br>D）知识融合<br>E）集群部署</p>\n</li>\n<li><p>下列属于数据预处理环节的有：<br>A）数据清洗<br>B）数据集成<br>C）数据变换<br>D）数据规约<br>E）数据销毁</p>\n</li>\n<li><p>高质量的训练数据通常需要满足：<br>A）准确性<br>B）完整性<br>C）一致性<br>D）时效性<br>E）数量无限大</p>\n</li>\n</ol>\n<h3>C3 判断题（2 题）</h3>\n<ol>\n<li>数据量越大，模型效果就一定越好。（ ）</li>\n<li>知识图谱采用图结构表示实体及其关系。（ ）</li>\n</ol>\n<h3>C4 填空题（3 题）</h3>\n<ol>\n<li><p>请用&quot;实体—关系—实体&quot;三元组表示：&quot;上海位于中国&quot;。<br>______ — ______ — ______</p>\n</li>\n<li><p>请用&quot;实体—属性—属性值&quot;三元组表示：&quot;珠穆朗玛峰的海拔约 8848 米&quot;。<br>______ — ______ — ______</p>\n</li>\n<li><p>判断下列三元组属于模式层还是数据层：<br>（1）&quot;城市—位于—国家&quot;属于 ______ 层；<br>（2）&quot;上海—位于—中国&quot;属于 ______ 层。</p>\n</li>\n</ol>\n<hr>\n<h2>D 组 · 综合应用（6 题，模拟真题场景风格）</h2>\n<ol>\n<li><p>某医院利用知识图谱技术开发诊疗辅助系统。下列功能最能体现知识图谱核心优势的是：<br>A）根据患者症状自动推导出可能病因，并提供诊断依据和鉴别要点<br>B）统计医学文献中关键词的出现频率<br>C）按姓名、病历号快速检索电子病历<br>D）把医生语音实时转写为文字</p>\n</li>\n<li><p>某农业公司用无人机拍摄农田图像，自动识别病虫害区域。这主要应用了人工智能的哪项技术：<br>A）计算机视觉<br>B）语音识别<br>C）机器翻译<br>D）数据库管理</p>\n</li>\n<li><p>某高速公路监控系统要求对摄像头画面&quot;就地实时分析&quot;，把结果传回中心，避免上传全部原始视频。该系统最适合采用：<br>A）边缘计算<br>B）增加硬盘容量<br>C）云计算集中处理全部原始视频<br>D）升级显示器</p>\n</li>\n<li><p>用户发现某大模型在回答历史问题时，把两件不相干的事件&quot;拼接&quot;成一段看似合理但完全不存在的描述。这属于大模型的：<br>A）幻觉<br>B）过拟合<br>C）数据泄露<br>D）渲染错误</p>\n</li>\n<li><p>某系统每秒处理 500 帧传感器数据，每帧包含 10 万个点，每个点需 3 次浮点运算。每秒总计算量是：<br>A）1.5×10⁷ 次/秒<br>B）1.5×10⁸ 次/秒<br>C）1.5×10⁹ 次/秒<br>D）5×10⁷ 次/秒</p>\n</li>\n<li><p>用三元组表示&quot;姚明的身高是 226 厘米&quot;，正确的是：<br>A）姚明 — 身高 — 226 厘米（实体—属性—属性值）<br>B）身高 — 姚明 — 226 厘米（属性—实体—属性值）<br>C）226 厘米 — 姚明 — 身高（属性值—实体—属性）<br>D）姚明 — 226 厘米 — 身高（实体—属性值—属性）</p>\n</li>\n</ol>\n<hr>\n","text":"建议：单选每题 1 分钟、多选每题 2 分钟、判断 30 秒。做完再去第三部分对答案。 A 组 · 基本概念 A1 单项选择题（12 题） \"人工智能（AI）\"这一术语正式提出的标志性会议是： A）1950 年图灵测试的提出 B）1956 年达特茅斯会议 C）1997 年深蓝战胜国际象棋冠军 D）2012 年 AlexNet 夺得 ImageNet 冠军 提出\"人工智能\"概念、被称为\"人工智能之父\"的科学家是： A）艾伦·图灵 B）约翰·麦卡锡 C）杰弗里·辛顿 D）蒂姆·伯纳斯-李 被称为\"深度学习革命\"起点的事件是： A）深蓝战胜卡斯帕罗夫 B）AlexNet 在 ImageNet 竞赛中夺冠 C）AlphaGo 战胜李世石 D）GPT-3 发布 AlphaGo 战胜围棋世界冠军李世石发生在： A）2012 年 B）2014 年 C）2016 年 D）2018 年 当前大模型的\"地基\"——Transformer 架构提出于： A）2012 年 B）2015 年 C）2017 年 D）2020 年 2025 年发布的 DeepSeek-R1 最重要的突破是： A）推理的算力成本大幅降低 B）首次实现多模态生成 C）参数规模达到万亿级 D）实现了通用人工智能 弱人工智能与强人工智能的核心区别在于： A）是否具备自主意识与决策能力 B）是否依赖大数据 C）是否使用神经网络 D）是否使用机器学习 对当前人工智能发展阶段描述最恰当的是： A）符号主义主导阶段 B）依赖人工标注数据的阶段 C）多模态大模型与通用人工智能探索阶段 D）强人工智能普及阶段 当前深度学习技术属于三大学派中的： A）符号主义 B）联结主义 C）行为主义 D）经验主义 下列 不属于 大语言模型核心特征的是： A）基于 Transformer 等深度架构的多层神经网络 B）无需大量训练数据 C）参数规模庞大 D）具备多任务泛化能力 某教育平台为不同学习进度的学生 动态生成个性化的练习题和答案解析 ，这最能体现生成式人工智能的哪种能力： A）对学生的知识薄弱点自动归类 B）从数据中创造新内容 C）按预设课程大纲自动推送任务 D）识别论坛中的高频问题并生成统计报告 大语言模型的\"幻觉（Hallucination）\"是指： A）模型运行速度突然变慢 B）模型生成看似合理、实际错误或虚构的内容 C）模型无法识别图像 D）模型参数丢失 A2 多项选择题（4 题，每题 5 个选项） 关于大语言模型的特征，下列说法正确的有： A）基于 Transformer 等深度架构的多层神经网络 B）参数规模庞大 C）具备多任务泛化能力 D）无需训练数据即可获得语言能力 E）可通过提示工程引导其输出 下列属于人工智能典型技术领域的有： A）计算机视觉 B）自然语言处理 C）语音识别 D）机器人技术 E）活字印刷技术 下列属于大模型局限性或风险的有： A）可能生成与事实不符的\"幻觉\"内容 B）训练数据可能带来偏见 C）知识存在截止时间 D）训练与部署成本高 E）永远不会出错 下列属于弱人工智能应用的有： A）人脸识别闸机 B）智能音箱语音助手 C）机器翻译软件 D）具备自我意识的机器人 E）围棋 AI（AlphaGo） A3 判断题（3 题） 目前人类已经实现的所有人工智能都属于弱人工智能。（ ） 模型参数规模越大，模型效果就一定越好。（ ） ChatGPT 于 2020 年发布。（ ） B 组 · 算力 B1 单项选择题（10 题） 在现代计算机系统中，承担\"指令解析与通用计算\"任务的核心部件是： A）CPU B）GPU C）NPU D）显示器 GPU 最初被设计用于： A）数据库查询 B）图形渲染 C）文字处理 D）网络通信 NP td>B</td>\n<td>深度学习 = 联结主义</td>\n</tr>\n<tr>\n<td>10</td>\n<td>B</td>\n<td>&quot;无需大量训练数据&quot;是错的</td>\n</tr>\n<tr>\n<td>11</td>\n<td>B</td>\n<td>生成式 AI 核心 = 从数据中创造新内容</td>\n</tr>\n<tr>\n<td>12</td>\n<td>B</td>\n<td>幻觉 = 看似合理、实际错误</td>\n</tr>\n</tbody></table></div>\n<h3>A2 多选</h3>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>题号</th>\n<th>答案</th>\n<th>速记点</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td>ABCE</td>\n<td>D 错：必须依赖海量训练数据</td>\n</tr>\n<tr>\n<td>2</td>\n<td>ABCD</td>\n<td>活字印刷与 AI 无关</td>\n</tr>\n<tr>\n<td>3</td>\n<td>ABCD</td>\n<td>E 错：绝对化表述必是坑</td>\n</tr>\n<tr>\n<td>4</td>\n<td>ABCE</td>\n<td>D 是强 AI 设想，尚未实现</td>\n</tr>\n</tbody></table></div>\n<h3>A3 判断</h3>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>题号</th>\n<th>答案</th>\n<th>解析</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td>对</td>\n<td>目前实现的所有 AI 都属于弱人工智能</td>\n</tr>\n<tr>\n<td>2</td>\n<td>错</td>\n<td>&quot;一定&quot;过于绝对：数据质量、算法等同样重要</td>\n</tr>\n<tr>\n<td>3</td>\n<td>错</td>\n<td>ChatGPT 2022 年发布；2020 年发布的是 GPT-3</td>\n</tr>\n</tbody></table></div>\n<h2>B 组答案</h2>\n<h3>B1 单选</h3>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>题号</th>\n<th>答案</th>\n<th>速记点</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td>A</td>\n<td>CPU = 总导演，管指令解析与通用计算</td>\n</tr>\n<tr>\n<td>2</td>\n<td>B</td>\n<td>GPU 图形渲染起家</td>\n</tr>\n<tr>\n<td>3</td>\n<td>B</td>\n<td>NPU 专攻神经网络推理加速</td>\n</tr>\n<tr>\n<td>4</td>\n<td>D</td>\n<td>加速组件 = GPU / NPU / TPU</td>\n</tr>\n<tr>\n<td>5</td>\n<td>A</td>\n<td>低时延、就地处理 → 边缘计算</td>\n</tr>\n<tr>\n<td>6</td>\n<td>D</td>\n<td>算力三要素：处理器性能、数据传输、并行计算</td>\n</tr>\n<tr>\n<td>7</td>\n<td>C</td>\n<td>1 PFLOPS = 1000 TFLOPS</td>\n</tr>\n<tr>\n<td>8</td>\n<td>A</td>\n<td>TPU = 张量处理单元</td>\n</tr>\n<tr>\n<td>9</td>\n<td>A</td>\n<td>云计算：集中、弹性、按需</td>\n</tr>\n<tr>\n<td>10</td>\n<td>A</td>\n<td>推理单次计算量通常小于训练</td>\n</tr>\n</tbody></table></div>\n<h3>B2 多选</h3>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>题号</th>\n<th>答案</th>\n<th>速记点</th>\n</tr>\n</thead>\n<tbody><tr ap\"><table>\n<thead>\n<tr>\n<th>题号</th>\n<th>答案</th>\n<th>速记点</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td>ABCD</td>\n<td>表格是结构化，不是非结构化</td>\n</tr>\n<tr>\n<td>2</td>\n<td>ABCD</td>\n<td>集群部署是工程部署，不是图谱构建步骤</td>\n</tr>\n<tr>\n<td>3</td>\n<td>ABCD</td>\n<td>预处理四步：清洗→集成→变换→规约</td>\n</tr>\n<tr>\n<td>4</td>\n<td>ABCD</td>\n<td>E 错：数量不是无限越好，质量更关键</td>\n</tr>\n</tbody></table></div>\n<h3>C3 判断</h3>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>题号</th>\n<th>答案</th>\n<th>解析</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td>错</td>\n<td>&quot;一定&quot;是坑：还要看质量、多样性、算法</td>\n</tr>\n<tr>\n<td>2</td>\n<td>对</td>\n<td>知识图谱 = 图结构 + 实体关系</td>\n</tr>\n</tbody></table></div>\n<h3>C4 填空</h3>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>题号</th>\n<th>答案</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td>上海 — 位于 — 中国</td>\n</tr>\n<tr>\n<td>2</td>\n<td>珠穆朗玛峰 — 海拔 — 约 8848 米</td>\n</tr>\n<tr>\n<td>3</td>\n<td>（1）模式层；（2）数据层</td>\n</tr>\n</tbody></table></div>\n<h2>D 组答案</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>题号</th>\n<th>答案</th>\n<th>速记点</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td>A</td>\n<td>知识图谱优势 = 语义关联 + 逻辑可溯（能给出依据）</td>\n</tr>\n<tr>\n<td>2</td>\n<td>A</td>\n<td>图像识别 = 计算机视觉</td>\n</tr>\n<tr>\n<td>3</td>\n<td>A</td>\n<td>就地实时 → 边缘计算</td>\n</tr>\n<tr>\n<td>4</td>\n<td>A</td>\n<td>一本正经胡说八道 = 幻觉</td>\n</tr>\n<tr>\n<td>5</td>\n<td>B</td>\n<td>500 × 10 万 × 3 = 1.5×10⁸ 次/秒</td>\n</tr>\n<tr>\n<td>6</td>\n<td>A</td>\n<td>实体—属性—属性值</td>\n</tr>\n</tbody></table></div>\n<hr>\n","text":"A 组答案 A1 单选 题号 答案 速记点 1 B 1956 达特茅斯会议，AI 诞生 2 B 麦卡锡提出\"人工智能\"概念 3 B 2012 AlexNet = 深度学习革命起点 4 C 2016 AlphaGo 5 C 2017 Transformer，大模型地基 6 A DeepSeek-R1 = 推理成本大降 7 A 弱/强 AI 看有无自主意识与决策能力 8 C 当前处于多模态 + AGI 探索阶段 9 B 深度学习 = 联结主义 10 B \"无需大量训练数据\"是错的 11 B 生成式 AI 核心 = 从数据中创造新内容 12 B 幻觉 = 看似合理、实际错误 A2 多选 题号 答案 速记点 1 ABCE D 错：必须依赖海量训练数据 2 ABCD 活字印刷与 AI 无关 3 ABCD E 错：绝对化表述必是坑 4 ABCE D 是强 AI 设想，尚未实现 A3 判断 题号 答案 解析 1 对 目前实现的所有 AI 都属于弱人工智能 2 错 \"一定\"过于绝对：数据质量、算法等同样重要 3 错 ChatGP
