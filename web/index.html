function aiTokenize(q) {
  const out = [];
  (q.toLowerCase().match(/[a-z0-9_+.#]{2,}/g) || []).forEach((t) => out.push(t));
  const cjk = (q.match(/[\u4e00-\u9fa5]+/g) || []).join('');
  for (let i = 0; i + 1 < cjk.length; i++) {
    const g = cjk.slice(i, i + 2);
    if (!AI_STOP.has(g)) out.push(g);
  }
  return Array.from(new Set(out)).slice(0, 40);
}
/** 在全部资料里打分：词频 + 标题命中 + 当前页加权 */
function aiSearch(q, ctx) {
  const tokens = aiTokenize(q);
  const hits = [];
  Object.entries(DOCS).forEach(([docId, doc]) => doc.sections.forEach((s, idx) => {
    const text = (s.text || '').toLowerCase(), title = `${s.title} ${s.tab || ''}`.toLowerCase();
    let score = 0;
    tokens.forEach((t) => {
      let i = 0, n = 0;
      while ((i = text.indexOf(t, i)) >= 0) { n++; i += t.length; if (n > 8) break; }
      score += n;
      if (title.includes(t)) score += 6;
    });
    if (ctx.docId && docId === ctx.docId) score += idx === ctx.idx ? 5 : 2;
    if (score > 0) hits.push({ docId, idx, sec: s, score, docTitle: doc.title });
  }));
  return hits.sort((a, b) => b.score - a.score).slice(0, aiThink ? 5 : 3);
}
function aiSnippet(text, q, len = 160) {
  let at = -1;
  aiTokenize(q).forEach((t) => { const i = (text || '').toLowerCase().indexOf(t); if (i >= 0 && (at < 0 || i < at)) at = i; });
  const from = Math.max(0, (at < 0 ? 0 : at) - 28);
  return (from > 0 ? '…' : '') + (text || '').slice(from, from + len).trim() + '…';
}
/** 生成一条回答（不是大模型生成的，是从资料里检索出来的，所以不撒谎） */
function aiAnswer(q) {
  const hits = aiSearch(q, aiCtx);
  const curDoc = aiCtx.docId ? DOCS[aiCtx.docId] : null;
  const sec = curDoc ? curDoc.sections[aiCtx.idx] : null;
  if (!hits.length) {
    return { kind: 'miss', label: '没找到', text: `你自己的资料里没找到相关段落。换个关键词再试，或者点下面按钮去 DeepSeek 问（我会把问题${sec ? '和当前这一页' : ''}一起带过去）。` };
  }
  const onThis = sec ? hits.find((h) => h.docId === aiCtx.docId && h.idx === aiCtx.idx) : null;
  let text = onThis
    ? `你正看的这一节里就有答案。下面是从你资料里抽出来的相关原文（${hits.length} 处）：`
    : sec
      ? `不在你正看的这一节，但资料里找到 ${hits.length} 处相关的内容：`
      : `在你自己的 ${Object.keys(DOCS).length} 本资料里找到 ${hits.length} 处相关的内容：`;
  if (aiThink) text += '\n\n深度思考模式：我没法替你推理，但可以把这几处原文按"先看结论、再看推导"的顺序排给你，骨架是——' + (onThis ? sec.title : hits[0].sec.title) + ' 这一节按小标题往下读。';

    kind: 'local',

    sources: hits.map((h) => ({
      docId: h.docId, idx: h.idx,

/** 左边缘右滑打开抽屉；抽屉上左滑收起 */
function bindSwipe() {
  const page = $('.chatPage');
  if (!page || page.dataset.swipe) return;
  page.dataset.swipe = '1';
  let sx = 0, sy = 0, mode = '';
  page.addEventListener('touchstart', (e) => {
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY;
    mode = sx < 48 ? 'open' : ($('#drawer').classList.contains('on') ? 'close' : '');
  }, { passive: true });
  page.addEventListener('touchmove', (e) => {
    if (!mode) return;
    const t = e.touches[0], dx = t.clientX - sx, dy = Math.abs(t.clientY - sy);
    if (dy > 60) { mode = ''; return; }
    if (mode === 'open' && dx > 56) { openDrawer(); mode = ''; }
    if (mode === 'close' && dx < -48) { closeDrawer(); mode = ''; }
  }, { passive: true });
}

/** 清掉 Service Worker 缓存再重载（PWA 换了新版本时用） */
async function hardReload() {
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map((r) => r.unregister()));
    }
    if (window.caches) { const ks = await caches.keys(); await Promise.all(ks.map((k) => caches.delete(k))); }
  } catch (e) { /* 忽略 */ }
  location.reload();
}
function downloadText(filename, text) {

    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1200);
    toast('已导出：' + filename);

function setLevelRefresh() {

          : (aiCtx.threadTitle || (aiCtx.docId && DOCS[aiCtx.docId] ? DOCS[aiCtx.docId].title : '随手问'));
    }
    $$('.lv').forEach((b) => b.classList.toggle('on', b.dataset.v === aiCtx.kind));
    const dw = $('#dwBody');
    if (dw) dw.innerHTML = drawerHTML();
    ensureChatThread();
    paintChatPage();

function setLevel(kind) {
  if (aiCtx.kind === kind) { closeDrawer(); return; }
  if (aiCtx.kind === 'chat') lastC = { docId: aiCtx.docId, idx: aiCtx.idx, threadId: aiCtx.threadId, threadTitle: aiCtx.threadTitle, threadSub: aiCtx.threadSub };
  if (kind === 'brain') aiCtx = { docId: null, idx: 0, kind: 'brain', threadId: 'brain' };
  else if (kind === 'assistant') aiCtx = { docId: null, idx: 0, kind: 'assistant', threadId: 'assistant' };
  else {
    const c = lastC || {};
    aiCtx = { docId: c.docId || null, idx: c.idx || 0, kind: 'chat', threadId: c.threadId || 'global', threadTitle: c.threadTitle, threadSub: c.threadSub };
  }
  remoteMsgs = [];
  aiCtx.loadedThread = null;
  setLevelRefresh();
  toast(aiCtx.kind === 'brain' ? '切到 A 级：总大脑（方向、规划）' : aiCtx.kind === 'assistant' ? '切到 B 级：助教（每日复盘）' : '切到 C 级：问答');
}
function applyDaily(d) {
  if (!d || !(d.suggest || []).length) { toast('这份日报里没有可写入的任务'); return; }
  const tomorrow = new Date(Date.now() + 86400000);
  const key = `${tomorrow.getFullYear()}-${String(tomorrow.getMonth() + 1).padStart(2, '0')}-${String(tomorrow.getDate()).padStart(2, '0')}`;
  state.tasks[key] = state.tasks[key] || [];
  let n = 0;
  d.suggest.forEach((s) => {
    if (!s.title || state.tasks[key].some((x) => x.title === s.title)) return;
    state.tasks[key].push({ title: s.title, course: 'nc1', min: Number(s.min) || 30, done: false });
    n++;
  });
  saveState();
  toast(n ? `已写进明天（${key.slice(5)}）的任务：${n} 条` : '这些任务已经在列表里了');
}

function openAI(docId, idx, kind) {
  const isBrain = (kind || aiCtx.kind) === 'brain' && !docId;
  aiCtx = { docId: docId || null, idx: Number(idx) || 0, kind: isBrain ? 'brain' : 'chat' };
  aiOpen = true;
  state.chats = state.chats || {};
  if (backend.online) {
    // 连了后端：会话内容以后端为准
    const tid = isBrain ? 'brain' : (aiCtx.docId ? `doc-${aiCtx.docId}` : 'global');
    const doc = aiCtx.docId ? DOCS[aiCtx.docId] : null;
    const sec = doc ? doc.sections[aiCtx.idx] : null;
    const wrap0 = aiShell();
    aiPaint();
    markTab('ai');
    requestAnimationFrame(() => { $('#aiMask', wrap0).classList.add('on'); $('#aiPanel', wrap0).classList.add('on'); });
    loadRemoteThread(tid, aiCtx.kind, isBrain ? '总大脑' : (doc ? doc.title : '随手问'), sec ? (sec.tab || sec.title) : '全部资料')
      .then(() => { if (aiOpen) aiPaint(); });
    probeBackend().then(() => { if (aiOpen) aiPaint(); });
    return;
  }
  const key = chatKey();
  if (!state.chats[key]) {
    const doc = aiCtx.docId ? DOCS[aiCtx.docId] : null;
    const sec = doc ? doc.sections[aiCtx.idx] : null;
    state.chats[key] = [{
      role: 'ai', kind: 'intro', at: Date.now(),
      text: sec
        ? `你在读《${doc.title} · ${sec.tab || sec.title}》。问我这一节的内容就行——\n原型里没接大模型接口，我的回答是"从你自己这 7 本资料里检索出来的原文"，找不到我会直接说没找到，不会编。要真模型推理，就把下面那个模型切成 DeepSeek V4 / R1。`
        : `现在没有指定哪一节，我会在你全部 7 本资料里找（计算机一级 3 本 + GAMES101 4 本）。\n说清楚一点的问法更好使，比如"深度缓冲和 z-fighting 什么关系""算力模块 CPU/GPU/NPU 怎么分工"。`,
    }];
    saveState();
  }
  const wrap = aiShell();
  aiPaint();
  markTab('ai');
  requestAnimationFrame(() => { $('#aiMask', wrap).classList.add('on'); $('#aiPanel', wrap).classList.add('on'); });
}

function aiSend(preset) {
  const ta = $('#aiText');
  const text = (preset || (ta ? ta.value : '') || '').trim();
  if (!text || aiBusy) return;
  if (ta) { ta.value = ''; ta.style.height = 'auto'; }
  if (backend.online) { aiSendRemote(text); return; }     // 连了后端就走真模型
  const key = chatKey();
  state.chats[key] = state.chats[key] || [];
  state.chats[key].push({ role: 'me', text, at: Date.now() });
  saveState();
  aiBusy = true;
  aiPaint();

  if (aiModel !== 'local') {
    setTimeout(() => {
      aiBusy = false;
      state.chats[key].push({
        role: 'ai', kind: 'handoff', at: Date.now(),
        text: `当前选的是 ${(AI_MODELS.find((x) => x[0] === aiModel) || [])[1]}。原型是个纯本地文件，拿不到 API key，所以我没法替你调它——但问题我已经连这一页的上下文一起准备好了，点下面按钮直接去问。`,
      });
      saveState(); aiPaint();
    }, 520);
    return;
  }
  setTimeout(() => {
    aiBusy = false;
    state.chats[key].push(Object.assign({ role: 'ai', at: Date.now() }, aiAnswer(text)));
    saveState();
    aiPaint();
  }, 620);
}
function aiDeepSeek() {
  const chat = state.chats[chatKey()] || [];

const EXAM_DATE = '2026-09-19';           // 计算机一级考试（备考指南里的 9/19–21 首日）
async function probeBackend() {
  try {
    const r = await fetch('/api/health', { cache: 'no-store' });
    if (!r.ok) throw new Error('offline');
    const j = await r.json();
    backend = { online: true, hasKey: !!j.hasKey, mock: !!j.mock, model: j.model || '', keyHint: j.keyHint || '' };
    pushSnapshot();
  } catch (e) {
    backend = { online: false, hasKey: false, mock: true, model: '' };   // 直接双击 html 打开时就是这种
  }
  return backend;
}
/** 把"学习数据快照"同步给后端 —— 总大脑就是靠它知道你的进度 */
function stateSnapshotForBrain() {
  const courses = COURSES.map((c) => {
    const s = courseStat(c);
    return { id: c.id, name: c.name, done: s.done, total: s.total };
  }).filter((c) => c.total);
  const notes = allNotes().slice(0, 8).map((n) => ({
    where: `${(DOCS[n.docId] || {}).title || ''} · ${n.secTitle || ''}`,
    text: String(n.text || '').slice(0, 120),
  }));
  const daysLeft = Math.max(0, Math.ceil((new Date(EXAM_DATE + 'T00:00:00') - Date.now()) / 86400000));
  return { courses, tasks: state.tasks, notes, mistakes: state.misses || [], examDate: EXAM_DATE, daysLeft };
}
let pushTimer = null;
function pushSnapshot() {
  if (!backend.online) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => {
    fetch('/api/state', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ state: stateSnapshotForBrain() }),
    }).catch(() => {});
  }, 600);
}
/** 从回答里把总大脑给的排期（```plan 代码块）抠出来 */
function parsePlan(text) {
  const m = String(text || '').match(/```plan\s*([\s\S]*?)```/);
  if (!m) return { text, plan: null };
  try {
    const plan = JSON.parse(m[1].trim());
    return { text: text.replace(m[0], '').trim(), plan };
  } catch (e) { return { text, plan: null }; }
}
/** 助教（B 级）的日报块 ```daily */
function parseDaily(text) {
  const m = String(text || '').match(/```daily\s*([\s\S]*?)```/);
  if (!m) return { text, daily: null };
  try {
    return { text: String(text).replace(m[0], '').trim(), daily: JSON.parse(m[1].trim()) };
  } catch (e) { return { text, daily: null }; }
}
/** 两个块一起抠（谁有算谁） */
function parseBlocks(text) {
  const a = parseDaily(text);
  const b = parsePlan(a.text);
  return { text: b.text, plan: b.plan, daily: a.daily };
}

async function loadRemoteThread(threadId, kind, title, sub) {
  remoteMsgs = [];
  try {
    const r = await fetch(`/api/thread?id=${encodeURIComponent(threadId)}`, { cache: 'no-store' });
    if (r.ok) {
      const t = await r.json();
      if (t && t.id) {
        aiCtx.threadTitle = t.title;
        remoteMsgs = (t.messages || []).map((m) => {
          if (m.role === 'user') return { role: 'me', text: m.content, at: Date.parse(m.at) || Date.now() };
          const parsed = parseBlocks(m.content);    // 历史消息里也把 ```plan / ```daily 块还原成卡片
          return { role: 'ai', text: parsed.text, plan: parsed.plan, daily: parsed.daily, at: Date.parse(m.at) || Date.now() };
        });
      }
    }
  } catch (e) { /* 新会话就是空的 */ }
  aiCtx.threadId = threadId;
  aiCtx.kind = kind;
  aiCtx.threadTitle = title || aiCtx.threadTitle;
  aiCtx.threadSub = sub || '';
  return remoteMsgs.length;
}

      aiPaint(); aiBusy = false; openSettingsSheet(); return;
    }
    const doc0 = aiCtx.docId ? DOCS[aiCtx.docId] : null;
    const sec0 = doc0 ? doc0.sections[aiCtx.idx] : null;
    pushMsg({ role: 'me', text, at: Date.now() });
    const answer = { role: 'ai', text: '', at: Date.now(), streaming: true };
    pushMsg(answer);
    aiBusy = true; aiPaint();
    const sys = systemPrompt(kind);   //"先想再答"那类说明
    const ctx = [
      kind === 'brain' ? '【他的整体数据】\n' + JSON.stringify(stateSnapshotForBrain(), null, 1) : '',
      sec0 ? `【正在看的这一节】${sec0.title}\n${String(sec0.text || '').slice(0, 2200)}` : '',
      aiAttach && !sec0 ? localHitsText(text) : '',
    ].filter(Boolean).join('\n\n');
    const messages = [
      { role: 'system', content: sys + (ctx ? '\n\n===== 你看到的数据 =====\n' + ctx : '') },
      ...currentMsgs().slice(-13).filter((m) => m !== answer && m.text).map((m) => ({ role: m.role === 'me' ? 'user' : 'assistant', content: m.text })),
    ];
    let out = '';
    try {
      const raw = NATIVE.deepseekChat(JSON.stringify({
        apiKey: st.apiKey, model: cfg.model, messages, effort: cfg.effort || 'auto',
        baseUrl: st.baseUrl || 'https://api.deepseek.com',
      }));
      const j = JSON.parse(raw || '{}');
      if (j && j.ok) out = j.content || '';
      else out = '调用 DeepSeek 失败：' + ((j && j.error) || '未知错误');
    } catch (e) { out = '调用失败：' + e.message; }
    answer.text = out;
    answer.streaming = false;
    aiBusy = false;
    const parsedD = parseBlocks(out);
    answer.plan = parsedD.plan; answer.daily = parsedD.daily; answer.text = parsedD.text;
    saveState();
    aiPaint();
    return;
  }
  const threadId = aiCtx.threadId || (isBrain ? 'brain' : kind === 'assistant' ? 'assistant' : (aiCtx.docId ? `doc-${aiCtx.docId}` : 'global'));
  const doc = aiCtx.docId ? DOCS[aiCtx.docId] : null;
  const sec = doc ? doc.sections[aiCtx.idx] : null;
  const title = isBrain ? '总大脑' : kind === 'assistant' ? '助教 · 每日复盘' : (doc ? doc.title : '随手问');
  const sub = isBrain ? '规划 · 建议 · 总导师' : kind === 'assistant' ? '每日复盘 · 注意事项 · 细节反馈' : (sec ? (sec.tab || sec.title) : '全部资料');
  aiCtx.threadId = threadId;
  aiCtx.kind = kind;
  aiCtx.threadTitle = title;
  // "带资料"开着、又不在具体某一节时：先在本地资料里检索，把命中的原文一起给模型
  let extra = '';
  if (aiAttach && !sec) {
    const hits = aiSearch(text, { docId: null, idx: 0 });
    if (hits.length) extra = hits.map((h) => `【${h.docTitle} · ${h.sec.tab || h.sec.title}】${aiSnippet(h.sec.text, text, 280)}`).join('\n');
  }

  pushMsg({ role: 'me', text, at: Date.now() });
  const answer = { role: 'ai', text: '', at: Date.now(), streaming: true, threadId };
  remoteMsgs.push(answer);
  aiBusy = true;
  aiPaint(true);
  const node = () => $('#aiStreamBody');
  try {
    const res = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        threadId, kind, title, sub, message: text,
        effort: levelCfg(kind).effort || 'auto',
        model: levelCfg(kind).model,
        state: stateSnapshotForBrain(),
        section: sec ? { doc: doc.title, title: sec.title, text: sec.text } : null,
        extra,
      }),
    });
    if (!res.ok || !res.body) throw new Error('后端没响应');

        const chunk = buf.slice(0, i).trim();
        buf = buf.slice(i + 2);
        if (!chunk.startsWith('data:')) continue;
        let ev = {};
        try { ev = JSON.parse(chunk.slice(5).trim()); } catch (e) { continue; }
        if (ev.delta) {
          answer.text += ev.delta;
          const el = node();
          if (el) el.innerHTML = aiAnswerBody(answer);      // 只刷这一条，不整块重画
          const body = $('#aiBody'); if (body) body.scrollTop = body.scrollHeight;
        }
        if (ev.error) { answer.text += `\n\n（后端报错：${ev.error}）`; }
        if (ev.thread && ev.thread.title) { aiCtx.threadTitle = ev.thread.title; aiCtx.threadId = ev.thread.id; }
      }
    }
  } catch (e) {
    answer.text += `\n\n（连不上后端：${e.message}。确认 server 在跑，或先用离线模式）`;
  }
  answer.streaming = false;
  aiBusy = false;
  const parsed = parseBlocks(answer.text);
  answer.plan = parsed.plan;
  answer.daily = parsed.daily;
  answer.text = parsed.text;
  aiPaint();
}

function toggleItem(itemId, field) {
  const it = ITEM_BY_ID[itemId];

  cur[field] = !cur[field];

    } else {

/* ---------- 最近阅读：在阅读器里停留满 10 分钟才记一笔 ---------- */
const READ_MIN_SEC = 600;                  // 10 分钟
function startReadTimer(docId, idx) {
  stopReadTimer();
  readSession = { docId, idx, since: Date.now() };
  readSession.timer = setInterval(flushRead, 15000);
}
function flushRead() {
  if (!readSession) return;
  const now = Date.now();
  const sec = Math.round((now - readSession.since) / 1000);
  if (sec < 5) return;                     // 少于 5 秒不算（快速划过不算阅读）
  readSession.since = now;
  state.readTime = state.readTime || {};
  state.lastSec = state.lastSec || {};
  const before = state.readTime[readSession.docId] || 0;
  state.readTime[readSession.docId] = before + sec;
  state.lastSec[readSession.docId] = readSession.idx;
  if (before < READ_MIN_SEC && state.readTime[readSession.docId] >= READ_MIN_SEC) {
    state.recent = (state.recent || []).filter((r) => r.docId !== readSession.docId);
    state.recent.unshift({ docId: readSession.docId, at: now });
    state.recent = state.recent.slice(0, 8);
    toast('这一节读了 10 分钟以上，已记进「最近阅读」');
  }
  saveState();
}
function stopReadTimer() {
  if (!readSession) return;
  clearInterval(readSession.timer);
  flushRead();
  readSession = null;
}
/** 首页那一条"最近阅读 / 继续读" */
function recentRow() {

      <div class="recentEmpty">读满 ${READ_MIN_SEC / 60} 分钟的内容才会出现在这里 —— 免得刚点开划两下也占地方。</div></div>`;
  }
  return `<div class="recentWrap">
    <div class="recentHd">最近阅读 <span>读满 ${READ_MIN_SEC / 60} 分钟</span></div>
    <div class="recentRow">
      ${list.map((r) => {
        const doc = DOCS[r.docId];
        const item = ALL_ITEMS.find((i) => i.doc === r.docId);
        const c = item ? COURSES.find((x) => x.id === item.courseId) : null;
        const mins = Math.max(READ_MIN_SEC / 60, Math.round((state.readTime[r.docId] || 0) / 60));

        return `<div class="recentCard" data-act="resume" data-v="${r.docId}:${idx}">
          <span class="rcIco">${c ? courseGlyph(c) : ICONS.doc}</span>

}
const R_DAYS = [1, 3, 7, 21, 60];
const R_LABEL = ['第 1 次', '第 2 次', '第 3 次', '第 4 次', '第 5 次'];
function addDays(key, n) {
  const d = new Date(key + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function reviewOf(id) {
  if (!state.reviews[id]) state.reviews[id] = { stage: 0, nextAt: (state.items[id] && state.items[id].doneAt) || todayKey };
  return state.reviews[id];
}
/** 今天该复习的（学过的章节按周期到期） */
function dueReviews() {
  const out = [];
  ALL_ITEMS.forEach((it) => {
    if (!it.doc || !isDone(it)) return;
    const r = reviewOf(it.id);
    if (!r.nextAt || r.nextAt <= todayKey) out.push({ it, r });
  });
  return out.sort((a, b) => String(a.r.nextAt).localeCompare(String(b.r.nextAt)));
}
function daysAgo(key) {
  if (!key) return '—';
  return Math.max(0, Math.round((new Date(todayKey + 'T00:00:00') - new Date(key + 'T00:00:00')) / 86400000));
}

    focusLeft--;
    paintFocus();
    if (focusLeft <= 0) { stopFocus(); toast('专注 25 分钟完成 ✓ 起来动一动'); }
  }, 1000);
}
function paintFocus() {
  const el = $('#fclock');
  if (!el) return;
  const m = Math.floor(Math.max(0, focusLeft) / 60), s = Math.max(0, focusLeft) % 60;
  el.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}
function stopFocus() {
  clearInterval(focusTimer); focusTimer = null;
  const el = $('#focus'); if (el) el.classList.remove('on');
}

/* =========================================================================
   左侧原型导航（只在宽屏显示）
   ========================================================================= */
const SCREENS = [
  ['课程', [['#/', '1 · 我的课程'], ['#/c/g101', '2 · 课程详情（G101）'], ['#/c/nc1', '2 · 课程详情（一级）']]],
  ['阅读', [['#/r/hw1ans/0', '3 · 阅读器（作业1）'], ['#/r/l07/1', '3 · 阅读器（深度缓冲）'], ['#/r/nc1d2/1', '3 · 阅读器（算法·安全）']]],
  ['任务与记录', [['#/today', '4 · 今日任务'], ['#/review', '5 · 回顾 / 错题 / 笔记'], ['#/search', '6 · 搜索']]],
  ['AI', [['#/r/l07/2', '7 · 阅读器里的鲸鱼按钮'], ['#/', '7 · 底部导航 DeepSeek']]],
];
function paintBoard() {
  const board = $('#board');
  if (!board || board.dataset.done) return;
  const cur = '#' + (location.hash.replace(/^#/, '') || '/');
  board.dataset.done = '1';
}
function buildBoard() {
  const board = $('#board');
  const cur = '#' + (location.hash.replace(/^#/, '') || '/');
  board.innerHTML = `
    <h1>学习 App · 高保真原型</h1>
    <div class="board-sub">按你发的三张界面稿搭的，全部可点。<br>真机上（窄屏）自动满屏，没有边框。</div>
    ${SCREENS.map(([grp, list]) => `<div class="grp">${grp}</div>` + list.map(([href, label]) => {
      const on = (href === '#/' ? (cur === '#/' || cur === '#') : cur.startsWith(href.split('/').slice(0, 3).join('/')));
      return `<a class="nav ${on ? 'on' : ''}" href="${href}"><span class="dot"></span>${label}</a>`;
    }).join('')).join('')}
    <div class="grp">说明</div>
    <div class="foot">
      · 内容都是真素材：计算机一级 3 本 + GAMES101 4 本，来自你的 md 源文件<br>
      · 勾选、笔记、错题、任务都存本地（刷新不丢）<br>
      · 标 <code>待做</code> 的是还没做内容的章节<br>
      · 手机上打开：同一个文件，直接满屏
    </div>`;
}

window.addEventListener('hashchange', () => render('nav'));    // 路由跳转才带动效
installApiBridge();
buildBoard();

/* 手机 App：提示词是打包在 APK 里的（三种人设），读一次 */

  fetch('./prompts.json').then((r) => r.json()).then((j) => { DATA.prompts = j; }).catch(() => {});
  if (!settings().aiMode) { settings().aiMode = 'direct'; saveState(); }
}

/* 装成 App：由 http(s) 打开时注册 Service Worker（file:// 双击打开时不注册） */
if (location.protocol.startsWith('http') && 'serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => { /* 失败也不影响使用 */ });
  });
}
</script>
<script>
/* 让手机样机在任意窗口下完整可见：按窗口与机身的比例取缩放值，等比缩放（内容版式不变形）。 */
(function () {
  var PHONE_W = 412, PHONE_H = 868, PAD = 28;
  function fitPhone() {
    var phone = document.querySelector('.phone');
    if (!phone) return;
    var k = Math.min(1, (window.innerWidth - PAD * 2) / PHONE_W, (window.innerHeight - PAD * 2) / PHONE_H);
    phone.style.transform = 'scale(' + k + ')';
  }
  window.addEventListener('resize', fitPhone);
  window.addEventListener('orientationchange', fitPhone);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fitPhone);
  fitPhone();
})();
</script></body>
